<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laiba Mazhar</title>
<meta name="description" content="Data Scientist & ML Researcher — trustworthy and diagnosable ML systems.">
<meta name="theme-color" content="#0b0a09">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='none'><rect x='13' y='13' width='74' height='74' rx='14' stroke='%2338322e' stroke-width='7'/><path d='M50 30V50h20' stroke='%23ff6b35' stroke-width='10' stroke-linecap='round'/></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
/* ==========================================================================
   SIGNAL

   A warm charcoal ground with one living accent, mono labels carrying the
   metadata, and dot-grid texture under the sections. The previous pass went
   fully achromatic and read as a memorial; the fix is not more colour
   everywhere, it is one confident hue doing real work.

   Two accents, and they mean different things:
     --acc   orange, the voice of the page: indices, links, live state
     --pos   teal, reserved for status that is genuinely positive
   Anything else is a neutral. The neutrals are biased warm so the accent
   sits in the same family as its ground rather than on top of it.

   Dark only, deliberately. Following the OS preference meant a light-mode
   machine got a white page nobody asked for, so every colour is painted
   explicitly and the page never borrows a ground.
   ========================================================================== */
:root{
  color-scheme: dark;

  --bg:#0b0a09;
  --surface:#161413;
  --surface-2:#1d1a18;
  --line:#262220;
  --line-2:#38322e;

  --ink:#f4f1ef;
  --ink-2:#a8a09b;
  --ink-3:#7a726d;

  --acc:#ff6b35;              /* the page's voice: vivid, not gold */
  --acc-lit:#ff9466;
  --acc-dim:rgba(255,107,53,.14);
  --pos:#4ec9b0;              /* low-chroma teal, positive status only */
  --pos-dim:rgba(78,201,176,.13);

  --maxw:1180px;
  --gut:40px;
  --rail:132px;
  --r:6px;
  --r-sm:4px;

  --ease:cubic-bezier(.2,.7,.3,1);
  --out:cubic-bezier(.16,1,.3,1);

  --sans:"Inter Tight",ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --serif:var(--sans);        /* alias kept so nothing dangles */
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:88px;-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);
  font:400 15.5px/1.62 var(--sans);
  letter-spacing:-.008em;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
ul{list-style:none}
::selection{background:var(--acc);color:#0b0a09}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:var(--r-sm)}

.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--gut)}
@media(max-width:860px){ :root{--gut:20px;--rail:0px} }

/* display, text, and the mono that labels everything */
.ser{font-family:var(--sans);font-weight:600;letter-spacing:-.028em}
.mo{
  font-family:var(--mono);font-size:10.5px;font-weight:400;
  letter-spacing:.1em;text-transform:lowercase;font-variant-numeric:tabular-nums;
}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.skip{position:absolute;left:14px;top:-60px;z-index:200;background:var(--acc);color:#0b0a09;
  padding:10px 16px;border-radius:var(--r);font-weight:600;font-size:14px;transition:top .2s}
.skip:focus{top:14px}

/* a hairline that fades out at both ends rather than butting into nothing */
.fade-rule{height:1px;background:linear-gradient(to right,transparent,
  var(--line-2) 12%,var(--line-2) 88%,transparent)}

/* ============================================================== the gauge */
/* One repeated device: a reading on a track. Every instance is a real
   proportion of real content, never decoration. */
.bar{position:relative;height:4px;width:100%;background:var(--line);border-radius:99px;
  overflow:hidden}
.bar i{
  position:absolute;left:0;top:0;height:100%;width:0;border-radius:99px;
  background:linear-gradient(to right,var(--acc),var(--acc-lit));
  transition:width 1.2s var(--out);
}
.bar.cool i{background:linear-gradient(to right,var(--pos),#7df0bb)}
.in .bar i,.bar.on i{width:var(--w,0%)}

/* =================================================================== nav */
nav{
  position:sticky;top:0;z-index:80;
  background:color-mix(in srgb,var(--bg) 80%,transparent);
  backdrop-filter:blur(16px) saturate(150%);
  border-bottom:1px solid transparent;transition:border-color .35s;
}
nav.stuck{border-bottom-color:var(--line)}
.nav-in{display:flex;align-items:center;gap:24px;height:64px}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto}
.brand svg{width:17px;height:17px;flex:none;overflow:visible}
.brand svg .fr{fill:none;stroke:var(--line-2);stroke-width:6;transition:stroke .3s}
.brand svg .tk{fill:none;stroke:var(--acc);stroke-width:8;stroke-linecap:round;
  transition:transform .55s var(--out);transform-origin:50% 50%}
.brand:hover svg .fr{stroke:var(--acc-dim)}
.brand:hover svg .tk{transform:rotate(90deg)}
.brand b{font-weight:600;font-size:15.5px;letter-spacing:-.026em}

.nav-links{display:flex;gap:24px;position:relative;align-self:stretch;align-items:center}
.nav-links a{
  color:var(--ink-3);font-family:var(--mono);font-size:11px;letter-spacing:.04em;
  white-space:nowrap;transition:color .25s;
}
.nav-links a::before{content:"#";color:var(--acc);opacity:.45;margin-right:2px;
  transition:opacity .25s}
.nav-links a:hover{color:var(--ink-2)}
.nav-links a:hover::before{opacity:.8}
.nav-links a.on{color:var(--ink)}
.nav-links a.on::before{opacity:1}
/* one rule that slides to the section you are in */
.nav-ind{
  position:absolute;bottom:13px;left:0;width:0;height:2px;border-radius:2px;background:var(--acc);
  opacity:0;transition:left .45s var(--out),width .45s var(--out),opacity .3s;
}
.nav-ind.on{opacity:1}
@media(max-width:1080px){ .nav-links{display:none} }

.ib{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line-2);
  border-radius:var(--r);color:var(--ink-2);flex:none;
  transition:border-color .25s,color .25s,background .25s}
.ib:hover{border-color:var(--acc);color:var(--acc);background:var(--acc-dim)}
.ib svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
#burger{display:none}
@media(max-width:1080px){ #burger{display:grid} }
.nav-r{display:flex;align-items:center;gap:10px;flex:none}
@media(max-width:640px){ .nav-r .btn{display:none} }

/* ---------------------------------------------------------------- buttons */
.btn{
  display:inline-flex;align-items:center;gap:9px;padding:10px 17px;border-radius:var(--r);
  font-size:13.5px;font-weight:500;
  border:1px solid var(--line-2);color:var(--ink-2);position:relative;overflow:hidden;
  transition:border-color .3s,color .3s,transform .3s;
}
.btn::before{
  content:"";position:absolute;inset:0;background:var(--acc-dim);
  transform:scaleX(0);transform-origin:left;transition:transform .45s var(--out);
}
.btn:hover{border-color:var(--acc);color:var(--acc-lit);transform:translateY(-1px)}
.btn:hover::before{transform:scaleX(1)}
.btn svg,.btn span{position:relative}
.btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#0b0a09;font-weight:600}
.btn.pri::before{background:#fff;opacity:.18}
.btn.pri:hover{color:#0b0a09;border-color:var(--acc-lit);background:var(--acc-lit)}

/* -------------------------------------------------------------- mobile nav */
.drawer{position:fixed;inset:0;z-index:95;background:var(--bg);display:flex;flex-direction:column;
  padding:16px var(--gut) 30px;opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.drawer.open{opacity:1;pointer-events:auto}
.dtop{display:flex;align-items:center;justify-content:space-between;height:54px}
.drawer ul{margin-top:16px;flex:1;overflow-y:auto}
.drawer li{border-bottom:1px solid var(--line)}
.drawer li a{display:flex;align-items:baseline;gap:16px;padding:16px 2px;
  font-weight:600;font-size:23px;letter-spacing:-.03em}
.drawer li a span{font-family:var(--mono);font-size:11px;color:var(--acc);flex:none;
  letter-spacing:.04em}
.dfoot{display:flex;flex-wrap:wrap;gap:8px;padding-top:18px}

/* ================================================================== hero */
header{padding:64px 0 68px;border-bottom:1px solid var(--line);position:relative;
  isolation:isolate;overflow:hidden}   /* clips the canvas bleed below */
@media(max-width:860px){ header{padding:32px 0 44px} }
/* the ambient field, drawn on canvas behind the hero */
.field{position:absolute;inset:-6% -4%;width:108%;height:112%;z-index:-1;
  pointer-events:none;opacity:.9}
.hero{display:grid;grid-template-columns:1fr 240px;gap:56px;align-items:end}
@media(max-width:860px){ .hero{grid-template-columns:1fr;gap:30px} }

.eyebrow{display:flex;align-items:center;gap:12px;color:var(--acc);margin-bottom:22px}
.eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--pos);
  flex:none;box-shadow:0 0 0 3px var(--pos-dim)}
.eyebrow::after{content:"";flex:1;height:1px;max-width:180px;transform-origin:left;
  background:linear-gradient(to right,var(--line-2),transparent)}
h1{font-weight:600;letter-spacing:-.042em;line-height:.98;font-size:clamp(44px,6.6vw,82px)}
h1 em{font-style:normal;font-weight:300;color:var(--ink-3);letter-spacing:-.038em}
h1::after{content:".";color:var(--acc)}
.tagline{font-size:clamp(16.5px,1.6vw,20px);line-height:1.46;margin-top:22px;max-width:34ch;
  color:var(--ink);font-weight:400}
.intro{color:var(--ink-2);margin-top:18px;max-width:66ch;font-size:15px}
.cta{display:flex;flex-wrap:wrap;gap:9px;margin-top:28px}

.portrait{position:relative}
.portrait img{width:100%;aspect-ratio:1/1;object-fit:cover;border:1px solid var(--line-2);
  border-radius:var(--r);filter:saturate(.95)}
.portrait .cap{display:flex;align-items:center;gap:9px;margin-top:11px;color:var(--ink-3)}
.portrait .cap b{width:5px;height:5px;border-radius:50%;background:var(--pos);flex:none}
@media(max-width:860px){ .portrait{max-width:150px} }

/* --- the readings: mono keys, real counts --- */
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-top:44px;
  background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
@media(max-width:640px){ .strip{grid-template-columns:1fr} }
.mag{background:var(--surface);padding:18px 20px}
.mag b{font-family:var(--mono);font-weight:500;font-size:30px;line-height:1;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums;display:block;color:var(--acc-lit)}
.mag .lb{color:var(--ink-3);margin:9px 0 11px;display:block}

/* ============================================================== sections */
main section{padding:48px 0;border-bottom:1px solid var(--line);position:relative}
@media(max-width:860px){ main section{padding:38px 0} }
/* a dot grid, faint enough to be texture rather than pattern */
main section::before{
  content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background-image:radial-gradient(circle at 1px 1px,var(--line-2) 1px,transparent 0);
  background-size:26px 26px;
  mask-image:linear-gradient(to bottom,transparent,#000 22%,#000 78%,transparent);
}
.s-head{display:grid;grid-template-columns:var(--rail) 1fr;gap:0;margin-bottom:26px;
  align-items:baseline}
.s-head .ix{color:var(--acc)}
.s-head .ix::before{content:"#";opacity:.5;margin-right:1px}
h2{font-weight:600;letter-spacing:-.036em;line-height:1;font-size:clamp(25px,3.1vw,36px)}
.s-head .rt{margin-left:auto;color:var(--ink-3);text-align:right}
.s-head .hb{display:flex;align-items:baseline;gap:16px}
@media(max-width:860px){
  .s-head{grid-template-columns:1fr;gap:10px}
  .s-head .ix{display:block}
}

/* --- a row: metadata in the rail, content in the body --- */
.led{display:grid;grid-template-columns:var(--rail) 1fr;gap:0;
  padding:26px 0;border-top:1px solid var(--line);position:relative}
.led:first-child{border-top:0;padding-top:0}
.led:last-child{padding-bottom:0}
.led::before{
  content:"";position:absolute;left:-14px;top:26px;bottom:26px;width:2px;border-radius:2px;
  background:var(--acc);transform:scaleY(0);transform-origin:top;
  transition:transform .45s var(--out);
}
.led:hover::before{transform:scaleY(1)}
.led-g{color:var(--ink-3);padding-right:22px}
.led-g .k{display:block}
.led-g .bar{margin-top:11px;max-width:62px}
@media(max-width:860px){
  .led{grid-template-columns:1fr;gap:11px;padding:22px 0}
  .led::before{display:none}
  .led-g{padding-right:0;display:flex;align-items:center;gap:14px}
  .led-g .bar{margin-top:0;flex:1;max-width:90px}
}

/* ============================================================== timeline */
/* Experience reads as a run of dated events, so it gets a spine with a node
   per role rather than the rail the other sections use. */
.tl{position:relative;padding-left:36px}
.tl::before{
  content:"";position:absolute;left:5px;top:8px;bottom:8px;width:1px;
  background:linear-gradient(to bottom,transparent,var(--line-2) 4%,var(--line-2) 96%,transparent);
}
.tlx{position:relative;padding-bottom:30px}
.tlx:last-child{padding-bottom:0}
.tl-dot{
  position:absolute;left:-36px;top:4px;width:11px;height:11px;border-radius:50%;
  background:var(--bg);border:2px solid var(--line-2);box-sizing:border-box;
  transition:border-color .45s var(--out),background .45s var(--out),transform .35s var(--out);
}
/* the node fills as the entry is reached, and lifts when pointed at */
.tlx.in .tl-dot{border-color:var(--acc);background:var(--acc)}
.tlx:hover .tl-dot{transform:scale(1.3)}
.tl-when{color:var(--acc);margin-bottom:10px}
.tl-body h3{font-weight:600;font-size:clamp(17px,1.9vw,20px);letter-spacing:-.028em;
  line-height:1.3;transition:color .3s}
.tlx:hover h3{color:var(--acc-lit)}
.tlx:hover .mark{transform:scale(1.06)}
@media(max-width:860px){
  .tl{padding-left:26px}
  .tl-dot{left:-26px}
  .tlx{padding-bottom:24px}
}

/* =============================================================== research */
.led h3{font-weight:600;font-size:clamp(18px,2vw,22px);
  line-height:1.28;letter-spacing:-.03em;max-width:44ch;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;
  transition:color .3s}
.led:hover h3{color:var(--acc-lit)}
.who{color:var(--ink-2);font-size:13.5px;margin-top:9px}
.st{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;
  color:var(--acc);border:1px solid var(--acc-dim);background:var(--acc-dim);
  padding:3px 8px;border-radius:99px;margin-left:9px;white-space:nowrap}
/* Abstracts run in full. They were clamped to two lines to keep the section
   inside one screen, which hid about seventy per cent of the longest one — the
   contribution of a paper is the part that was being cut. The row cap is what
   controls the section's height now, not truncation. */
.abs{color:var(--ink-2);font-size:14.5px;margin-top:12px;max-width:78ch}
.row{display:flex;gap:18px;margin-top:14px;flex-wrap:wrap}
.lnk{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;
  color:var(--acc-lit)}
.lnk::after{content:"→";transition:transform .3s var(--out)}
.lnk:hover::after{transform:translateX(5px)}

/* ================================================================== tags */
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:14px}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.02em;color:var(--ink-3);
  border:1px solid var(--line);background:var(--surface);padding:4px 9px;
  border-radius:var(--r-sm);white-space:nowrap;
  transition:color .25s,border-color .25s,background .25s}
.tag:hover{color:var(--acc-lit);border-color:var(--acc-dim);background:var(--acc-dim)}
.tag.plus{color:var(--acc);border-color:var(--acc-dim);background:var(--acc-dim)}

/* ============================================================ org marks */
.org-line{display:flex;align-items:center;gap:13px}
.mark{width:38px;height:38px;flex:none;display:grid;place-items:center;padding:6px;
  background:var(--ink);border-radius:var(--r-sm);transition:transform .4s var(--out)}
.mark img{max-width:100%;max-height:100%;object-fit:contain}
.mark .mg{font-family:var(--mono);font-size:12px;font-weight:500;color:#0b0a09}
.led:hover .mark{transform:scale(1.06)}
.orgn{color:var(--acc);font-size:14.5px;font-weight:500}
.where{color:var(--ink-3);font-size:12.5px;margin-top:2px}
.det{color:var(--ink-2);font-size:14px;margin-top:11px}
.led ul,.tl-body ul{margin-top:13px}
.led li,.tl-body li{color:var(--ink-2);font-size:14.5px;padding-left:18px;position:relative;
  margin-bottom:6px;max-width:76ch}
.led li::before,.tl-body li::before{content:"";position:absolute;left:0;top:9px;
  width:5px;height:5px;border-radius:50%;background:var(--acc-dim);
  border:1px solid var(--acc);box-sizing:border-box}

/* =============================================================== projects */
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
/* Six chips wrap to four rows on a phone, which cost more height than the two
   cards below them. One scrolling row instead. */
@media(max-width:860px){
  .filters{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;
    margin-inline:calc(var(--gut) * -1);padding-inline:var(--gut);
    scroll-snap-type:x proximity}
  .filters::-webkit-scrollbar{display:none}
  .chip{flex:none;scroll-snap-align:start}
}
.chip{border:1px solid var(--line);color:var(--ink-3);padding:7px 13px;border-radius:99px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;
  transition:border-color .25s,color .25s,background .25s}
.chip .n{opacity:.5;margin-left:7px}
.chip:hover{border-color:var(--line-2);color:var(--ink-2)}
.chip.on{border-color:var(--acc);color:#0b0a09;background:var(--acc);font-weight:500}
.chip.on .n{opacity:.65}

/* The grid owns the vanishing point; each card is its own 3D layer. Note the
   absence of overflow:hidden on .card — clipping forces a flatten and kills
   preserve-3d, so the sheen is clipped with a matching radius instead. */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(292px,1fr));gap:12px;
  perspective:1100px;perspective-origin:50% 40%}
.card{
  background:var(--surface);padding:20px;display:flex;flex-direction:column;
  border:1px solid var(--line);border-radius:var(--r);position:relative;
  transform-style:preserve-3d;will-change:transform;
  transition:border-color .3s,background .3s,transform .45s var(--out),box-shadow .45s;
}
.card:hover{box-shadow:0 26px 50px -30px rgba(0,0,0,.9),0 0 0 1px var(--acc-dim)}
/* the contents sit on their own planes, so they rise as the card turns */
.card .c-meta,.card h3,.card p,.card .tags{transition:transform .45s var(--out)}
.card:hover h3{transform:translateZ(34px)}
.card:hover .c-meta{transform:translateZ(22px)}
.card:hover p{transform:translateZ(14px)}
.card:hover .tags{transform:translateZ(8px)}
.card:hover{border-color:var(--acc-dim);background:var(--surface-2)}
/* a specular sheen tracking the pointer, on top of the tilt */
.card::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:0;
  border-radius:var(--r);                       /* stands in for overflow:hidden */
  background:radial-gradient(400px circle at var(--mx,50%) var(--my,50%),
    rgba(255,107,53,.13),transparent 60%);
  transition:opacity .45s var(--ease);
}
.card:hover::after{opacity:1}
.card>*{position:relative;z-index:1}
/* the card's own metadata line: index, category, and a flag when featured */
.c-meta{display:flex;align-items:center;gap:8px;margin-bottom:12px;color:var(--ink-3)}
.c-meta .cix{color:var(--acc)}
.c-meta .cat{color:var(--ink-3)}
.c-meta .flag{
  margin-left:auto;color:var(--pos);border:1px solid var(--pos-dim);background:var(--pos-dim);
  padding:2px 8px;border-radius:99px;font-size:9.5px;letter-spacing:.06em;
}
.card h3{font-weight:600;font-size:16.5px;letter-spacing:-.028em;
  line-height:1.32;display:flex;align-items:flex-start;gap:9px;transition:color .3s}
.card:hover h3{color:var(--acc-lit)}
.card .aw{margin-left:auto;flex:none;color:var(--ink-3);font-size:12px;
  transition:transform .35s var(--out),color .3s}
.card:hover .aw{transform:translate(4px,-4px);color:var(--acc)}
.card p{color:var(--ink-2);font-size:14px;margin-top:9px;flex:1}
.none{color:var(--ink-3);padding:24px 0}

/* Rows beyond the cap arrive on demand, so a section opens at about one
   screen. The cap applies inside whatever the filters have narrowed to. */
.more-wrap{display:flex;justify-content:center;margin-top:20px}
.more-wrap.off{display:none}
.more{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em}
.more svg{transition:transform .4s var(--out)}
.more.open svg{transform:rotate(180deg)}
/* revealed rows unfold instead of popping into place. No fill mode: with
   `both` the row holds opacity:0 until the animation starts, so anywhere
   animations are deferred the content sits there invisible. */
/* Offset only, no opacity. If the animation is ever frozen part-way the row
   sits six pixels high and fully readable, rather than invisible. */
@keyframes unfold{from{transform:translateY(-7px)}to{transform:none}}
.lifted{animation:unfold .45s var(--out)}

/* ================================================================= skills */
/* A card per area. The front carries the name, the count and its share of the
   93 listed skills; the tools live on the back and the card turns on hover.
   The largest area holds twelve, which is what sets the card height. */
.sk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
/* Tall enough for the largest area — seventeen tools — to fit without the back
   scrolling. A clipped chip on a card whose only job is listing tools is a bad
   trade, so this height is set by the worst case and checked against all of
   them rather than eyeballed. */
.sk{height:292px;perspective:1000px}
.sk-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;
  transition:transform .75s var(--out)}
/* hover turns it; focus-visible does too, or the back is unreachable by keyboard */
.sk:hover .sk-in,.sk:focus-visible .sk-in{transform:rotateY(180deg)}
.sk:focus-visible{outline:none}
.sk:focus-visible .sk-face{outline:1px solid var(--acc)}
.sk-face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border:1px solid var(--line);border-radius:var(--r);background:var(--surface);
  padding:19px;display:flex;flex-direction:column;
}
.sk:hover .sk-front{border-color:var(--acc-dim)}
.sk-front .g{color:var(--ink);font-weight:600;font-size:16.5px;letter-spacing:-.026em;
  line-height:1.25}
.sk-front .ct{color:var(--acc);margin-top:auto}
.sk-front .bw{margin-top:11px}
.sk-front .hint{color:var(--ink-3);margin-top:13px;display:flex;align-items:center;gap:7px}
.sk-front .hint::after{content:"";flex:1;height:1px;
  background:linear-gradient(to right,var(--line-2),transparent)}
.sk-back{
  transform:rotateY(180deg);background:var(--surface-2);border-color:var(--acc-dim);
  overflow-y:auto;scrollbar-width:thin;
}
.sk-back .bh{color:var(--acc);margin-bottom:11px;flex:none}
.sk-i{display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start}
.sk-i span{font-size:12px;color:var(--ink-2);background:var(--surface);
  border:1px solid var(--line);padding:3px 8px;border-radius:var(--r-sm);
  transition:color .2s,border-color .2s}
.sk-i span:hover{color:var(--acc-lit);border-color:var(--acc-dim)}

/* No hover to flip on, and no motion when it is not wanted: drop the card to
   its natural height and show the tools directly. The front only carries the
   count and the gauge, both repeated on the back, so nothing is lost. */
@media (hover:none),(prefers-reduced-motion:reduce){
  .sk{height:auto;perspective:none}
  .sk-in{transform:none!important;height:auto}
  .sk-front{display:none}
  .sk-back{position:static;transform:none!important;overflow:visible;
    backface-visibility:visible;-webkit-backface-visibility:visible}
}

/* ================================================================= awards */
.awd{display:grid;grid-template-columns:var(--rail) 1fr;padding:12px 0;
  border-top:1px solid var(--line);font-size:14.5px;align-items:baseline;
  transition:padding-left .4s var(--out)}
.awd:first-child{border-top:0}
.awd:hover{padding-left:10px}
.awd .y{color:var(--ink-3);font-family:var(--mono);font-size:10.5px;transition:color .3s}
.awd:hover .y{color:var(--acc)}
@media(max-width:860px){ .awd{grid-template-columns:1fr;gap:4px} .awd .y{order:-1} }

/* ============================================================= activities */
/* One entry per line: a long rounded rectangle, the title held in a column on
   the left and the whole description beside it. A grid of squares made these
   read as tiles and cut the longer descriptions awkwardly short. */
.acts{display:flex;flex-direction:column;gap:10px}
.act{
  background:var(--surface);border:1px solid var(--line);border-radius:20px;
  padding:20px 26px;position:relative;overflow:hidden;
  display:grid;grid-template-columns:300px 1fr;gap:28px;align-items:start;
  transition:border-color .3s,background .3s;
}
.act:hover{border-color:var(--acc-dim);background:var(--surface-2)}
.act::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--acc);transform:scaleY(0);transform-origin:top;
  transition:transform .45s var(--out)}
.act:hover::before{transform:scaleY(1)}
.act h3{font-weight:600;font-size:15.5px;letter-spacing:-.026em;line-height:1.34;
  transition:color .3s}
.act:hover h3{color:var(--acc-lit)}
.act p{color:var(--ink-2);font-size:13.5px;margin:0}
@media(max-width:860px){
  .act{grid-template-columns:1fr;gap:8px;padding:17px 20px;border-radius:16px}
}
.g-label{display:flex;align-items:center;gap:14px;color:var(--ink-3);margin:30px 0 14px}
.g-label::before{content:"#";color:var(--acc);opacity:.5}
.g-label::after{content:"";flex:1;height:1px;
  background:linear-gradient(to right,var(--line-2),transparent)}
.g-label:first-child{margin-top:0}

/* ==================================================== interests & langs */
.two{display:grid;grid-template-columns:1fr 1fr;gap:48px}
@media(max-width:780px){ .two{grid-template-columns:1fr;gap:30px} }
.ch{color:var(--ink-3);margin-bottom:16px}
.lg{padding:12px 0;border-top:1px solid var(--line)}
.lg:first-of-type{border-top:0}
.lg-t{display:flex;align-items:baseline;gap:14px}
.lg-t b{font-weight:600;font-size:15.5px;letter-spacing:-.026em}
.lg-t span{color:var(--ink-3);font-size:12.5px;margin-left:auto;text-align:right}
.lg .bar{margin-top:9px;max-width:180px}

/* ================================================================= footer */
footer{padding:72px 0 48px;position:relative}
.fcta{font-weight:600;letter-spacing:-.042em;line-height:1.04;
  font-size:clamp(29px,5vw,54px);max-width:24ch}
.fcta em{font-style:normal;font-weight:300;color:var(--acc)}
.mail{display:inline-flex;align-items:center;gap:13px;margin-top:26px;
  font-size:clamp(16px,2vw,21px);font-family:var(--mono);letter-spacing:-.02em;
  border-bottom:1px solid var(--line-2);padding-bottom:6px;
  transition:color .3s,border-color .3s}
.mail:hover{color:var(--acc-lit);border-bottom-color:var(--acc)}
.mail small{font-family:var(--mono);font-size:9px;letter-spacing:.1em;
  color:var(--ink-3);border:1px solid var(--line-2);border-radius:99px;padding:3px 8px}
.fbar{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-top:48px;padding-top:20px;
  border-top:1px solid var(--line);color:var(--ink-3);font-size:12.5px}
.flinks{display:flex;gap:18px;flex-wrap:wrap;margin-left:auto}
.flinks a{color:var(--ink-2);font-family:var(--mono);font-size:11px;transition:color .25s}
.flinks a:hover{color:var(--acc-lit)}

/* ================================================================= to top */
.top{position:fixed;right:18px;bottom:18px;z-index:70;width:38px;height:38px;
  border-radius:var(--r);border:1px solid var(--line-2);background:var(--surface);
  color:var(--ink-2);display:grid;place-items:center;opacity:0;pointer-events:none;
  transform:translateY(8px);transition:opacity .35s,transform .35s,border-color .25s,color .25s}
.top.show{opacity:1;pointer-events:auto;transform:none}
.top:hover{border-color:var(--acc);color:var(--acc)}
.top svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}

/* ================================================================= reveal */
/* Visible by default. Only hidden while `reveal-on` sits on <html>, which JS
   adds after confirming IntersectionObserver works and removes if it never
   fires. A scroll animation must degrade to "shown", never to a blank page. */
.rv{transition:opacity .7s var(--out),transform .7s var(--out)}
html.reveal-on .rv:not(.in){opacity:0;transform:translateY(16px)}
html:not(.reveal-on) .rv{transition:none}   /* same reasoning as .w above */

/* ========================================================== transitions */
/* Masked word reveal: each word sits in a clipped box and the glyphs slide up
   out of it, so a heading assembles line by line instead of fading. The mask
   is what sells it — without overflow:hidden this is just a slide.

   It degrades twice over. If the split never runs there are no .w wrappers and
   the heading is plain text; if the observer never fires, showAll() adds .in. */
.w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.06em}
.w>i{display:inline-block;font-style:normal;transition:transform .8s var(--out)}
/* The offset state lives under reveal-on only, the same guard the row reveal
   uses. Without that gate a browser that never runs the transition leaves the
   glyphs parked below their mask and the heading reads as blank. */
html.reveal-on .w>i{transform:translateY(110%)}
html.reveal-on .in .w>i,html.reveal-on .w-go .w>i{transform:none}
/* And no transition to traverse when the reveal is off, so the failsafe path
   snaps straight to readable instead of easing from a state it can never
   leave if frames are throttled. */
html:not(.reveal-on) .w>i{transition:none}
/* stagger by position, capped so a long heading does not crawl */
.w:nth-child(1)>i{transition-delay:0ms}      .w:nth-child(2)>i{transition-delay:55ms}
.w:nth-child(3)>i{transition-delay:110ms}    .w:nth-child(4)>i{transition-delay:165ms}
.w:nth-child(5)>i{transition-delay:220ms}    .w:nth-child(6)>i{transition-delay:275ms}
.w:nth-child(n+7)>i{transition-delay:330ms}

/* an accent edge that sweeps across the top of a section as it arrives */
main section::after{
  content:"";position:absolute;top:-1px;left:0;height:1px;width:0;
  background:linear-gradient(to right,var(--acc),transparent);
  transition:width 1.4s var(--out);
}
main section.seen::after{width:100%}

/* ============================================================== the boot */
/* The page arrives as one sequence rather than scattered effects. Unfilled on
   purpose, for the same reason as .lifted above. */
@keyframes drawX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes settle{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

html.boot nav{animation:fade .5s var(--ease)}
html.boot .eyebrow::after{animation:drawX .9s var(--out) .4s}
html.boot .hero>div>*{animation:settle .8s var(--out)}
html.boot .hero>div>*:nth-child(1){animation-delay:.08s}
html.boot .hero>div>*:nth-child(2){animation-delay:.16s}
html.boot .hero>div>*:nth-child(3){animation-delay:.24s}
html.boot .hero>div>*:nth-child(4){animation-delay:.32s}
html.boot .hero>div>*:nth-child(5){animation-delay:.40s}
html.boot .portrait{animation:settle .95s var(--out) .28s}
html.boot .strip{animation:fade .9s var(--ease) .5s}
html.boot .field{animation:fade 1.6s var(--ease) .2s}

/* ======================================================== reduced motion */
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important}
  html.reveal-on .rv{opacity:1!important;transform:none!important;transition:none!important}
  .w>i{transform:none!important;transition:none!important}
  main section::after{transition:none;width:100%}
  .bar i{transition:none}
  .card:hover .aw,.mark,.brand:hover svg .tk{transform:none!important}
  .card:hover h3,.card:hover .c-meta,.card:hover p,.card:hover .tags{transform:none!important}
  .pgrid{perspective:none}
  .awd:hover{padding-left:0}
  .field{display:none}
}
/* A pointerless device must not keep hover states stuck on. */
@media (hover:none){
  .awd:hover{padding-left:0}
  .card::after{display:none}
  .pgrid{perspective:none}
  .card:hover h3,.card:hover .c-meta,.card:hover p,.card:hover .tags{transform:none}
}

/* ============================================================== utilities */
/* Last in the sheet on purpose. Rows collapsed by a "show more" button carry
   .gone, and several of them (.led, .awd, .acts children) set their own
   display, so this has to win on order rather than reach for !important. */
.gone{display:none}
</style>
</head>
<body>

<nav id="nav">
  <div class="wrap nav-in">

      <button class="ib" id="burger" aria-label="Open menu" aria-expanded="false" aria-controls="drawer">

<div class="drawer" id="drawer" aria-hidden="true">

  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg>
</button>

<script>
/* The local preview server sends no Cache-Control, so browsers keep serving a
   stale data.js after every edit. On localhost we add a timestamp; in
   production the URL stays clean. */
(() => {
  const dev = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
  const tag = document.createElement("script");
  tag.src = "data.js" + (dev ? "?t=" + Date.now() : "");
  tag.onload = () => boot();
  tag.onerror = () => document.body.innerHTML =
    '<p style="padding:40px;font:16px sans-serif">Could not load data.js</p>';
  document.head.append(tag);
})();
</script>

<script>
function boot(){
const $ = id => document.getElementById(id);
const el = (t, c, txt) => { const n = document.createElement(t); if (c) n.className = c;
  if (txt !== undefined) n.textContent = txt; return n; };
const tidy = s => String(s ?? "").replace(/\s+/g, " ").trim();
const ext = (a, u) => { a.href = u; a.target = "_blank"; a.rel = "noopener noreferrer"; return a; };

const SVGNS = "http://www.w3.org/2000/svg";
const icon = d => {
  const s = document.createElementNS(SVGNS, "svg");
  s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("aria-hidden", "true");
  const p = document.createElementNS(SVGNS, "path"); p.setAttribute("d", d);
  s.append(p); return s;
};
const ICON = {
  cv:'M14 3v5h5M13.5 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8.5Z',
  email:'M3 7.5A1.5 1.5 0 0 1 4.5 6h15A1.5 1.5 0 0 1 21 7.5v9A1.5 1.5 0 0 1 19.5 18h-15A1.5 1.5 0 0 1 3 16.5ZM3.6 7l8.4 6 8.4-6',
  github:'M9 19c-4 1.4-4-2.1-5.5-2.6m11.5 5v-3.6a3 3 0 0 0-.9-2.4c2.9-.3 4.9-1.5 4.9-5.2a4 4 0 0 0-1.1-2.8 3.7 3.7 0 0 0-.1-2.8s-1.2-.4-3.8 1.4a9.3 9.3 0 0 0-5 0C6.4 3.4 5.2 3.8 5.2 3.8a3.7 3.7 0 0 0-.1 2.8A4 4 0 0 0 4 9.4c0 3.7 2 4.9 4.9 5.2a3 3 0 0 0-.9 2.3V21',
  linkedin:'M6.5 9.5V18M6.5 6.2v.1M11 18v-4.8a2.7 2.7 0 0 1 5.4 0V18M3 4.5h18v15H3Z',
  scholar:'M12 3 2 8.5 12 14l10-5.5ZM6 11v5.5c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5V11',
};

/* a magnitude bar: width is a real proportion, animated in on reveal */
const mkBar = (pct, cool) => {
  const b = el("div", "bar" + (cool ? " cool" : ""));
  b.style.setProperty("--w", Math.max(3, Math.min(100, pct)) + "%");
  b.append(el("i"));
  return b;
};

document.title = DATA.name;
$("nav-name").textContent = DATA.name;
$("drawer-name").textContent = DATA.name;
if (DATA.title) $("h-eyebrow").textContent = DATA.title;

/* first name upright, surname in the serif italic */
const parts = String(DATA.name).split(/\s+/);
$("h-name").append(document.createTextNode(parts[0]));
if (parts.length > 1) {
  $("h-name").append(document.createTextNode(" "),
    el("em", "", parts.slice(1).join(" ")));
}
$("h-tag").textContent = DATA.tagline;
$("h-intro").textContent = tidy(DATA.intro);

/* ---------------------------------------------------------------- portrait */
if (DATA.photo?.src) {
  const img = new Image();
  img.src = DATA.photo.src; img.alt = DATA.photo.alt || DATA.name;
  img.onerror = () => $("h-portrait").remove();     // never leave a broken image
  $("h-portrait").append(img);
  if (DATA.location) {
    const cap = el("div", "cap mo");
    cap.append(el("b"), document.createTextNode(DATA.location));
    $("h-portrait").append(cap);
  }
} else $("h-portrait").remove();

/* ------------------------------------------------------------------- links */
const L = DATA.links || {};
const links = [
  L.cv       && { t:"Curriculum Vitae", u:L.cv, k:"cv", pri:true },
  L.email    && { t:"Email",    u:"mailto:" + L.email, k:"email" },
  L.github   && { t:"GitHub",   u:L.github,   k:"github" },
  L.linkedin && { t:"LinkedIn", u:L.linkedin, k:"linkedin" },
  L.scholar  && { t:"Scholar",  u:L.scholar,  k:"scholar" },
].filter(Boolean);

const mkBtn = x => {
  const a = el("a", "btn" + (x.pri ? " pri" : ""));
  a.append(icon(ICON[x.k]), document.createTextNode(x.t));
  if (x.u.startsWith("mailto")) a.href = x.u; else ext(a, x.u);
  return a;
};
links.forEach(x => $("h-cta").append(mkBtn(x)));
if (L.cv) { const b = $("nav-cv"); ext(b, L.cv); b.hidden = false; } else $("nav-cv").remove();

/* --------------------------------------------------------- ledger strip */
/* Three counts, each drawn against the largest of them so the bars compare. */
const mags = [
  [DATA.research?.length, "research manuscripts"],
  [DATA.projects?.length, "projects built"],
  [DATA.awards?.length,   "awards & honours"],
].filter(([n]) => n);
const peak = Math.max(...mags.map(([n]) => n), 1);
mags.forEach(([n, label], i) => {
  const d = el("div", "mag rv");
  d.append(el("b", "", String(n)), el("span", "lb mo", label), mkBar(n / peak * 100, i === 2));
  $("h-strip").append(d);
});

/* ====================================================== section machinery */
const main = $("main"), navl = $("navlinks"), dl = $("dlinks");
let n = 0;

function section(id, title, node, opts = {}) {
  if (!node) return;
  n++;
  const num = String(n).padStart(2, "0");
  const s = el("section"); s.id = id;
  const w = el("div", "wrap");

  const head = el("div", "s-head rv");
  head.append(el("span", "ix mo", num));
  const hb = el("div", "hb");
  hb.append(el("h2", "", title));
  if (opts.count) hb.append(el("span", "rt mo", opts.count));
  head.append(hb);
  w.append(head, node); s.append(w); main.append(s);

  const label = opts.nav || title;
  const a = el("a", "", label); a.href = "#" + id; navl.append(a);
  const li = el("li"), a2 = el("a");
  a2.href = "#" + id;
  a2.append(el("span", "", num), document.createTextNode(label));
  li.append(a2); dl.append(li);
}

const monogram = name => {
  const s = String(name).replace(/^TODO.*/i, "?").trim();
  const words = s.split(/\s+/).filter(w => w.length > 2 && !/^(of|and|the|for)$/i.test(w));
  if (words.length > 1) return words.slice(0, 2).map(w => w[0].toUpperCase()).join("");
  // A single word gives a single letter, which reads as a typo. Prefer its own
  // internal capitals — AiPixal becomes AP — and fall back to its first two.
  const one = words[0] || s;
  const caps = one.match(/[A-Z]/g);
  return caps && caps.length > 1 ? caps.slice(0, 2).join("") : one.slice(0, 2).toUpperCase();
};

function orgMark(logo, org) {
  const m = el("div", "mark");
  if (logo) {
    const img = new Image();
    img.src = logo; img.alt = org + " logo"; img.decoding = "async";
    // A monogram stands in if the file 404s, so nothing renders as broken.
    img.onerror = () => { m.textContent = ""; m.append(el("span", "mg", monogram(org))); };
    m.append(img);
  } else m.append(el("span", "mg", monogram(org)));
  return m;
}
const tagRow = (list, more) => { const t = el("div", "tags");
  list.forEach(x => t.append(el("span", "tag", x)));
  if (more > 0) t.append(el("span", "tag plus", "+" + more));
  return t; };

/* ------------------------------------------------------------- one screen */
/* Every long list keeps `show` rows and puts the rest behind a button, so a
   section lands in roughly a screen instead of scrolling for three.
   `lift` marks button-revealed rows as shown: they carry the scroll-reveal
   class and the observer already passed over them while they were display:none,
   so without it they unhide at zero opacity and sit there blank. */
const noMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
/* A row that sits in a three-column grid on a desktop stacks to full width on
   a phone, so the same count is two or three times as tall. Each section
   therefore keeps fewer rows on a narrow screen. Read once at boot: this only
   sets the opening count, and re-deriving it on resize would fight whatever
   the reader had already opened. */
const narrow = matchMedia("(max-width: 860px)").matches;
/* "Show 1 more degrees" reads as a bug, so the noun agrees with the count. */
const plural = (n, word) => n === 1 ? word.replace(/ies$/, "y").replace(/s$/, "") : word;
const keep = (wide, thin) => narrow ? thin : wide;

function moreBar(label, onToggle) {
  const wrap = el("div", "more-wrap rv");
  const btn = el("button", "btn more");
  const txt = el("span");
  btn.append(txt, icon("M6 9.5l6 6 6-6"));
  wrap.append(btn);
  btn.onclick = () => onToggle(wrap, btn, txt);
  return { wrap, btn, txt, label };
}

function collapse(box, sel, show, noun, after) {
  const rows = [...box.querySelectorAll(sel)];
  if (rows.length <= show) return null;
  let open = false;

  const paint = lift => {
    rows.forEach((r, i) => {
      const vis = open || i < show;
      r.classList.toggle("gone", !vis);
      if (vis && lift) { r.classList.add("in"); r.classList.add("lifted"); }
    });
    if (after) after();
    const rest = rows.length - show;
    txt.textContent = open ? "Show fewer" : `Show ${rest} more ${plural(rest, noun)}`;
    btn.classList.toggle("open", open);
    btn.setAttribute("aria-expanded", String(open));
  };

  const { wrap, btn, txt } = moreBar("", () => {
    open = !open;
    paint(true);
    // Collapsing shortens the page under the reader, so bring the button back.
    if (!open) wrap.scrollIntoView({ block: "nearest",
      behavior: noMotion() ? "auto" : "smooth" });
  });

  paint(false);
  box.append(wrap);
  return wrap;
}

/* a ledger row: gutter keys on the left, content on the right */
const ledger = (keys, body) => {
  const d = el("div", "led rv");
  const g = el("div", "led-g mo");
  keys.filter(Boolean).forEach(k => g.append(typeof k === "string" ? el("span", "k", k) : k));
  d.append(g, body);
  return d;
};

/* =============================================================== research */
if (DATA.research?.length) {
  const box = el("div");
  DATA.research.forEach((p, i) => {
    const b = el("div");
    b.append(el("h3", "", p.title));
    const who = el("p", "who", `${p.authors} · ${p.year}`);
    if (p.status) who.append(el("span", "st", p.status));
    b.append(who);
    if (p.abstract) b.append(el("p", "abs", tidy(p.abstract)));
    if (p.tags?.length) b.append(tagRow(p.tags));
    if (p.links?.length) {
      const r = el("div", "row");
      p.links.forEach(x => r.append(ext(el("a", "lnk", x.label), x.url)));
      b.append(r);
    }
    box.append(ledger([String(i + 1).padStart(2, "0"), p.year], b));
  });
  collapse(box, ".led", keep(3, 2), "manuscripts");
  section("research", "Research", box, { count: DATA.research.length + " manuscripts" });
}

/* ============================================================== education */
if (DATA.education?.length) {
  const box = el("div");
  DATA.education.forEach(e => {
    const b = el("div");
    const line = el("div", "org-line");
    line.append(orgMark(e.logo, e.org));
    const t = el("div");
    t.append(el("h3", "", e.degree), el("div", "orgn", e.org));

    line.append(t); b.append(line);
    if (e.detail) b.append(el("div", "det", e.detail));

    box.append(ledger([e.period], b));

}

/* ============================================================= experience */
if (DATA.experience?.length) {
  const box = el("div", "tl");
  DATA.experience.forEach(j => {
    const row = el("div", "tlx rv");
    row.append(el("span", "tl-dot"));
    row.append(el("div", "tl-when mo", j.period));

    const b = el("div", "tl-body");
    const line = el("div", "org-line");
    line.append(orgMark(j.logo, j.org));
    const t = el("div");
    t.append(el("h3", "", j.role), el("div", "orgn", j.org));

    line.append(t); b.append(line);

  /* No cap. Five roles is the whole working history and it belongs on one
     page — a career behind a button is a career nobody reads. */
  section("experience", "Experience", box, { count: DATA.experience.length + " roles" });
}

/* =============================================================== projects */
/* Six show first and the rest arrive on a button. The filters narrow the set,
   the cap applies inside whatever is left, and picking a filter starts over at
   six — so "show more" always refers to the list actually on screen. */
if (DATA.projects?.length) {
  /* Nine on a desktop: that is three full rows of the grid, which covers all
     seven featured entries with no orphan row, plus two more. The whole point
     of curating the featured set is that it is seen without a click. */
  const STEP = keep(9, 3);
  const box = el("div");
  const cats = [...new Set(DATA.projects.map(p => p.category || "Other"))];
  const nFeat = DATA.projects.filter(p => p.featured).length;

  const SHOW_TAGS = 5;      // beyond this a card reads as a wall of chips
  const card = (p, i) => {
    const c = el(p.url ? "a" : "div", "card rv");
    c.dataset.cat = p.category || "Other";
    c.dataset.pick = p.featured ? "1" : "";
    if (p.url) ext(c, p.url);

    const meta = el("div", "c-meta mo");
    meta.append(el("span", "cix", String(i + 1).padStart(2, "0")),
                el("span", "sep", "/"),
                el("span", "cat", (p.category || "other").toLowerCase()));
    if (p.featured) meta.append(el("span", "flag", "featured"));
    c.append(meta);

    const h = el("h3", "", p.name);
    if (p.url) h.append(el("span", "aw", "↗"));
    c.append(h, el("p", "", tidy(p.blurb)));
    if (p.stack?.length)
      c.append(tagRow(p.stack.slice(0, SHOW_TAGS), p.stack.length - SHOW_TAGS));
    return c;
  };

  const filters = el("div", "filters rv");
  const grid = el("div", "pgrid");
  const none = el("p", "none", "Nothing here yet.");
  none.style.display = "none";

  [...DATA.projects].sort((a, b) => (b.featured ? 1 : 0) - (a.featured ? 1 : 0))
    .forEach((p, i) => grid.append(card(p, i)));

  const defs = [
    { k:"*", label:"All", n:DATA.projects.length },
    nFeat && { k:"@", label:"Selected", n:nFeat },
    ...cats.map(c => ({ k:c, label:c,
      n:DATA.projects.filter(p => (p.category || "Other") === c).length })),
  ].filter(Boolean);

  let filter = "*", cap = STEP;
  const hit = c => filter === "*" ? true
                 : filter === "@" ? c.dataset.pick === "1"
                 : c.dataset.cat === filter;
  const nHit = () => [...grid.querySelectorAll(".card")].filter(hit).length;

  const moreWrap = el("div", "more-wrap rv");
  const moreBtn  = el("button", "btn more");
  const moreTxt  = el("span");
  moreBtn.append(moreTxt, icon("M6 9.5l6 6 6-6"));
  moreWrap.append(moreBtn);

  /* `lift` marks the cards as revealed by the button rather than by scrolling.
     Without it a card unhidden below the fold keeps the reveal transform and
     sits there at zero opacity, because the observer already passed it by. */
  const paint = lift => {
    let n = 0;
    grid.querySelectorAll(".card").forEach(c => {
      if (!hit(c)) { c.classList.add("gone"); return; }
      n++;
      const vis = n <= cap;
      c.classList.toggle("gone", !vis);
      if (vis && lift) { c.classList.add("in"); c.classList.add("lifted"); }
    });
    none.style.display = n ? "none" : "block";

    const rest = Math.max(0, n - cap);
    moreWrap.classList.toggle("off", n <= STEP);
    moreBtn.classList.toggle("open", rest === 0);
    moreTxt.textContent = rest ? `Show ${rest} more ${plural(rest, "projects")}` : "Show fewer";
    moreBtn.setAttribute("aria-expanded", String(rest === 0));
  };

  moreBtn.onclick = () => {
    const n = nHit();
    const collapsing = cap >= n;
    cap = collapsing ? STEP : n;
    paint(true);
    // Collapsing shortens the page under the reader, so bring the button back.
    if (collapsing) moreWrap.scrollIntoView({ block: "nearest",
      behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  };

  defs.forEach((d, i) => {
    const b = el("button", "chip" + (i === 0 ? " on" : ""));
    b.append(document.createTextNode(d.label), el("span", "n", String(d.n)));
    b.onclick = () => {
      filters.querySelectorAll(".chip").forEach(x => x.classList.remove("on"));
      b.classList.add("on");
      filter = d.k; cap = STEP;      // a new filter starts the count over
      paint(true);
    };
    filters.append(b);
  });

  paint(false);
  box.append(filters, grid, none, moreWrap);
  section("projects", "Projects", box, { count: DATA.projects.length + " total" });
}

/* ================================================================= skills */
if (DATA.skills?.length) {
  const box = el("div", "sk-grid");
  const total = DATA.skills.reduce((a, s) => a + s.items.length, 0);
  const top = Math.max(...DATA.skills.map(s => s.items.length), 1);

  DATA.skills.forEach(s => {
    const d = el("div", "sk rv");
    d.tabIndex = 0;                    // the back face has to be reachable by key
    const inner = el("div", "sk-in");

    const front = el("div", "sk-face sk-front");
    front.append(el("div", "g", s.group));
    front.append(el("div", "hint mo", "hover"));
    front.append(el("div", "ct mo", s.items.length + " tools"));
    const bw = el("div", "bw");
    bw.append(mkBar(s.items.length / top * 100));
    front.append(bw);

    const back = el("div", "sk-face sk-back");
    back.append(el("div", "bh mo", s.group + " · " + s.items.length));
    const list = el("div", "sk-i");
    s.items.forEach(x => list.append(el("span", "", x)));
    back.append(list);

    inner.append(front, back);
    d.append(inner);
    box.append(d);
  });
  collapse(box, ".sk", keep(6, 6), "areas");
  section("skills", "Skills", box, { count: total + " across " + DATA.skills.length + " areas" });
}

/* ================================================================= awards */
if (DATA.awards?.length) {
  const box = el("div");
  DATA.awards.forEach(a => {
    const d = el("div", "awd rv");
    d.append(el("div", "y", a.year), el("div", "", a.text));
    box.append(d);
  });
  /* No cap here: thirteen short one-line rows cost less height than the button
     saved, and an award behind a click is an award nobody reads. */
  section("awards", "Awards", box, { count: DATA.awards.length + " entries" });
}

/* ============================================================= activities */
if (DATA.activities?.length) {
  const box = el("div");
  const groups = new Map();
  DATA.activities.forEach(a => {
    const k = a.group || "Other";
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(a);
  });
  groups.forEach((items, label) => {
    if (groups.size > 1) box.append(el("h3", "g-label mo rv", label));
    const g = el("div", "acts");
    items.forEach(a => {
      const d = el("div", "act rv");
      const h = el("h3");
      if (a.url) { const k = ext(el("a", "", a.title), a.url); k.append(el("span", "", " ↗")); h.append(k); }
      else h.textContent = a.title;
      d.append(h, el("p", "", tidy(a.text)));
      g.append(d);
    });
    box.append(g);
  });
  /* Rows collapse across groups, so a label whose grid emptied has to go too. */
  collapse(box, ".act", keep(6, 4), "entries", () => {
    box.querySelectorAll(".acts").forEach(g => {
      const empty = ![...g.children].some(c => !c.classList.contains("gone"));
      g.classList.toggle("gone", empty);
      const lab = g.previousElementSibling;
      if (lab && lab.classList.contains("g-label")) lab.classList.toggle("gone", empty);
    });
  });
  section("activities", "Certifications, ventures & community", box,
          { nav: "Community" });   /* nav stays short; the heading is complete */
}

/* ==================================================== interests & langs */
if (DATA.interests?.length || DATA.languages?.length) {
  const box = el("div", "two");
  if (DATA.interests?.length) {
    const c = el("div", "rv");
    c.append(el("div", "ch mo", "Interests"));
    const t = tagRow(DATA.interests); t.style.marginTop = "0";
    c.append(t); box.append(c);
  }
  if (DATA.languages?.length) {
    // The level is read straight off her own wording — nothing inferred beyond it.
    const lvl = s => /native/i.test(s) ? 100 : /basic/i.test(s) ? 40
                   : /fluent|professional/i.test(s) ? 80 : 60;
    const c = el("div", "rv");
    c.append(el("div", "ch mo", "Languages"));
    DATA.languages.forEach(l => {
      const d = el("div", "lg"), t = el("div", "lg-t");
      t.append(el("b", "", l.name), el("span", "", l.level));
      d.append(t, mkBar(lvl(l.level), true));
      c.append(d);
    });
    box.append(c);
  }
  section("interests", "Interests", box, { nav: "Interests" });
}

/* ================================================================= footer */
if (L.email) {
  const m = $("fmail");
  m.href = "mailto:" + L.email;
  m.append(document.createTextNode(L.email), el("small", "", "copy"));
  const badge = m.querySelector("small");
  m.addEventListener("click", ev => {
    if (!navigator.clipboard) return;                  // fall through to mailto:
    ev.preventDefault();
    navigator.clipboard.writeText(L.email).then(() => {
      badge.textContent = "copied";
      setTimeout(() => { badge.textContent = "copy"; }, 1600);
    }).catch(() => { location.href = m.href; });
  });
} else $("fmail").remove();

links.filter(x => x.k !== "cv").forEach(x => {
  const a = el("a", "", x.t);
  if (x.u.startsWith("mailto")) a.href = x.u; else ext(a, x.u);
  $("flinks").append(a);
});
$("fnote").textContent = "© " + new Date().getFullYear() + " " + DATA.name +
  (DATA.location ? " · " + DATA.location : "");

/* ============================================================== behaviour */
const root = document.documentElement;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* drawer */
const drawer = $("drawer"), burger = $("burger");
const setDrawer = o => {
  drawer.classList.toggle("open", o);
  drawer.setAttribute("aria-hidden", String(!o));
  burger.setAttribute("aria-expanded", String(o));
  document.body.style.overflow = o ? "hidden" : "";
};
burger.onclick = () => setDrawer(true);
$("dclose").onclick = () => setDrawer(false);
drawer.addEventListener("click", e => { if (e.target.closest("a")) setDrawer(false); });
addEventListener("keydown", e => { if (e.key === "Escape") setDrawer(false); });
links.forEach(x => $("dfoot").append(mkBtn(x)));

/* sticky nav + back-to-top */
const navEl = $("nav"), totop = $("totop");
let q = false;
const onScroll = () => {
  const y = scrollY;
  navEl.classList.toggle("stuck", y > 8);
  totop.classList.toggle("show", y > innerHeight * .9);
  q = false;
};
addEventListener("scroll", () => { if (!q) { q = true; requestAnimationFrame(onScroll); } },
  { passive: true });
onScroll();
totop.onclick = () => scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });

/* Wrap each word so it can slide out from behind a mask. Only text nodes are
   touched, so element children — the italic surname, inline links — survive. */
const splitWords = el => {
  if (!el || el.dataset.split) return;
  el.dataset.split = "1";
  [...el.childNodes].forEach(n => {
    if (n.nodeType !== 3 || !n.nodeValue.trim()) return;
    const frag = document.createDocumentFragment();
    n.nodeValue.split(/(\s+)/).forEach(tok => {
      if (!tok) return;
      if (!tok.trim()) { frag.append(document.createTextNode(tok)); return; }
      const w = document.createElement("span"); w.className = "w";
      const i = document.createElement("i"); i.textContent = tok;
      w.append(i); frag.append(w);
    });
    n.replaceWith(frag);
  });
};
document.querySelectorAll("main section h2, .fcta").forEach(splitWords);
if (!reduce) splitWords($("h-tag"));

/* reveal */
document.querySelectorAll(".rv").forEach(x => {
  const i = [...x.parentElement.children].indexOf(x);
  x.style.transitionDelay = Math.min(i * 45, 180) + "ms";
});
const targets = [...document.querySelectorAll(".rv")];
const showAll = () => {
  root.classList.remove("reveal-on");
  targets.forEach(x => x.classList.add("in"));
  // bars and masked words key off .in, so anything outside a .rv needs nudging
  document.querySelectorAll(".bar").forEach(b => b.classList.add("on"));
  document.querySelectorAll("main section, .fcta, .tagline").forEach(x => {
    x.classList.add("seen"); x.classList.add("w-go");
  });
};

if (!("IntersectionObserver" in window) || reduce) {
  showAll();
} else {
  root.classList.add("reveal-on");
  let seen = 0;
  const rio = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    seen++; e.target.classList.add("in"); rio.unobserve(e.target);
  }), { rootMargin: "0px 0px -8% 0px", threshold: .04 });
  targets.forEach(x => rio.observe(x));

  /* Sections sweep their top edge, and the footer line reveals its own words.
     Separate from the row observer because a section is far taller than the
     rows inside it and wants a different trigger point. */
  const bigio = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    e.target.classList.add("seen", "w-go");
    bigio.unobserve(e.target);
  }), { rootMargin: "0px 0px -12% 0px", threshold: .02 });
  document.querySelectorAll("main section, .fcta").forEach(x => bigio.observe(x));

  // Failsafe: nothing reported shortly after load means the observer is broken.
  // Show the page rather than leave it blank.
  setTimeout(() => { if (seen === 0) showAll(); }, 2500);
}

/* active nav link */
const all = [...document.querySelectorAll(".nav-links a, .drawer li a")];
const nio = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  all.forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id));
}), { rootMargin: "-45% 0px -50% 0px" });
document.querySelectorAll("main section").forEach(s => nio.observe(s));

/* The entrance runs now, with the content in place. Starting it earlier would
   animate an empty skeleton and be over before data.js had rendered a word. */
document.documentElement.classList.add("boot");
/* the hero line reveals with the entrance rather than on scroll */
requestAnimationFrame(() => $("h-tag").classList.add("w-go"));
initMotion();
}
</script>
<script>
/* ==========================================================================
   MOTION — with a real 3D scene

   The hero runs an actual three-dimensional scene: nodes placed in a layered
   volume, rotated around two axes, then perspective-projected to the canvas by
   hand. No library, so it costs about five kilobytes instead of six hundred,
   and it renders inside a strict content policy where a CDN script would not.

   The structure is a pipeline read as a graph — layers of operators with edges
   running forward between them, and one node lit, because deciding which
   operator moved the metric is what the research is about.

   Everything here is skipped when the reader asks for reduced motion.
   ========================================================================== */
function initMotion() {
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ====================================================== the 3D scene */
  const canvas = document.querySelector(".field");
  if (canvas && !still) {
    const ctx = canvas.getContext("2d", { alpha: true });

    /* --- build the graph in model space -------------------------------- */
    /* Four layers along x, each a small grid in y and z. Edges run forward
       only, so it reads as flow rather than a mesh. */
    const LAYERS = 4, ROWS = 3, COLS = 3;
    const nodes = [], edges = [];
    for (let l = 0; l < LAYERS; l++)
      for (let r = 0; r < ROWS; r++)
        for (let c = 0; c < COLS; c++)
          nodes.push({
            x: (l - (LAYERS - 1) / 2) * 116,
            y: (r - (ROWS - 1) / 2) * 74,
            z: (c - (COLS - 1) / 2) * 74,
            layer: l,
          });

    const at = (l, r, c) => l * ROWS * COLS + r * COLS + c;
    // a deterministic pseudo-random so the graph is the same every load
    const rnd = (i) => ((Math.sin(i * 12.9898) * 43758.5453) % 1 + 1) % 1;
    let k = 0;
    for (let l = 0; l < LAYERS - 1; l++)
      for (let r = 0; r < ROWS; r++)
        for (let c = 0; c < COLS; c++)
          for (let rr = 0; rr < ROWS; rr++)
            for (let cc = 0; cc < COLS; cc++)
              if (rnd(k++) > 0.79)
                edges.push([at(l, r, c), at(l + 1, rr, cc)]);

    // the lit node: middle layer, centre. The one the page is about.
    const HOT = at(1, 1, 1);

    /* --- traffic ------------------------------------------------------- */
    /* A graph with static edges reads as a diagram. Packets moving along them
       read as a network that is actually carrying something, which is the whole
       point of the motif. A few are dedicated to edges touching the lit node,
       so the operator under investigation visibly fires.

       Abstract on purpose: no numbers are drawn anywhere on this canvas, so
       nothing here can be mistaken for a real measurement. */
    const hotEdges = edges.map((e, i) => [e, i]).filter(([e]) => e.includes(HOT)).map(([, i]) => i);
    const packets = [];
    for (let i = 0; i < 18; i++) {
      const onHot = i < 4 && hotEdges.length;
      packets.push({
        e: onHot ? hotEdges[i % hotEdges.length] : Math.floor(rnd(900 + i) * edges.length),
        t: rnd(500 + i),
        v: 0.0022 + rnd(700 + i) * 0.0038,
        hot: !!onHot,
      });
    }
    let respawn = 0;
    const step = () => {
      for (const q of packets) {
        q.t += q.v;
        if (q.t <= 1) continue;
        q.t = 0;
        // a hot packet stays on the lit node's edges; the rest wander
        q.e = q.hot && hotEdges.length
          ? hotEdges[Math.floor(rnd(respawn++) * hotEdges.length)]
          : Math.floor(rnd(respawn++) * edges.length);
      }
    };

    let w = 0, h = 0, raf = 0, t = 0;
    const size = () => {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      const r = canvas.getBoundingClientRect();
      w = r.width; h = r.height;
      canvas.width = Math.max(1, Math.round(w * dpr));
      canvas.height = Math.max(1, Math.round(h * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };

    /* --- project one model point to the screen ------------------------- */
    const FOCAL = 620;
    const proj = (p, ay, ax, ox, oy, zoom) => {
      // rotate about y, then about x
      const cy = Math.cos(ay), sy = Math.sin(ay);
      let x = p.x * cy - p.z * sy;
      let z = p.x * sy + p.z * cy;
      const cx2 = Math.cos(ax), sx2 = Math.sin(ax);
      let y = p.y * cx2 - z * sx2;
      z = p.y * sx2 + z * cx2;
      const s = FOCAL / (FOCAL + z + 340);      // pushed back so nothing inverts
      return { x: ox + x * s * zoom, y: oy + y * s * zoom, s, z };
    };

    const draw = () => {
      ctx.clearRect(0, 0, w, h);

      const ay = t;                             // slow yaw
      const ax = Math.sin(t * 0.7) * 0.22;      // gentle nod, never a full roll
      const zoom = Math.min(1, w / 980);
      /* The scene drifts against the scroll, so the hero has real depth as it
         leaves rather than sliding away as one flat plane. */
      const par = Math.min(scrollY / Math.max(h, 1), 1) * 90;
      const ox = w * (w < 700 ? 0.5 : 0.62), oy = h * 0.5 - par;

      const pr = nodes.map(n => proj(n, ay, ax, ox, oy, zoom));

      // edges first, dimmed by depth so the far side recedes
      ctx.lineWidth = 1;
      for (const [a, b] of edges) {
        const A = pr[a], B = pr[b];
        const depth = (A.s + B.s) / 2;
        const hot = a === HOT || b === HOT;
        ctx.strokeStyle = hot
          ? "rgba(255,148,102," + (depth * 0.5).toFixed(3) + ")"
          : "rgba(255,107,53," + (depth * 0.19).toFixed(3) + ")";
        ctx.beginPath();
        ctx.moveTo(A.x, A.y);
        ctx.lineTo(B.x, B.y);
        ctx.stroke();
      }

      /* packets: a short trail plus a bright head, both scaled by depth so one
         travelling away genuinely recedes */
      for (const q of packets) {
        const [a, b] = edges[q.e];
        const A = pr[a], B = pr[b];
        const tail = Math.max(0, q.t - 0.06);
        const px = A.x + (B.x - A.x) * q.t, py = A.y + (B.y - A.y) * q.t;
        const tx = A.x + (B.x - A.x) * tail, ty = A.y + (B.y - A.y) * tail;
        const ps = A.s + (B.s - A.s) * q.t;

        ctx.beginPath();
        ctx.moveTo(tx, ty); ctx.lineTo(px, py);
        ctx.strokeStyle = q.hot
          ? "rgba(78,201,176," + (ps * 0.5).toFixed(3) + ")"
          : "rgba(255,148,102," + (ps * 0.38).toFixed(3) + ")";
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(px, py, Math.max(0.8, 1.7 * ps), 0, 6.2832);
        ctx.fillStyle = q.hot ? "rgba(120,230,205,.9)" : "rgba(255,180,140,.85)";
        ctx.fill();
      }
      ctx.lineWidth = 1;

      // nodes back-to-front, so nearer ones overlap correctly
      const order = pr.map((p, i) => i).sort((a, b) => pr[b].z - pr[a].z);
      for (const i of order) {
        const p = pr[i];
        const rad = Math.max(0.6, 2.2 * p.s);
        if (i === HOT) {
          const pulse = 0.5 + 0.5 * Math.sin(t * 9);
          ctx.beginPath();
          ctx.arc(p.x, p.y, rad + 5 + pulse * 4, 0, 6.2832);
          ctx.fillStyle = "rgba(78,201,176," + (0.16 * (1 - pulse * .5)).toFixed(3) + ")";
          ctx.fill();
          ctx.beginPath();
          ctx.arc(p.x, p.y, rad + 1.4, 0, 6.2832);
          ctx.fillStyle = "rgba(78,201,176,.95)";
          ctx.fill();
          continue;
        }
        ctx.beginPath();
        ctx.arc(p.x, p.y, rad, 0, 6.2832);
        ctx.fillStyle = "rgba(255,148,102," + (0.24 + p.s * 0.5).toFixed(3) + ")";
        ctx.fill();
      }
    };

    /* Painting is split from scheduling so a single frame can be drawn
       synchronously. A scene that only appears once rAF runs shows a blank box
       anywhere frames are throttled. */
    const frame = () => {
      t += 0.0022;
      step();
      draw();
      raf = requestAnimationFrame(frame);
    };

    size();
    draw();
    /* Paused whenever the hero is off screen — an animation nobody can see is
       pure battery cost. */
    new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting && !raf) raf = requestAnimationFrame(frame);
      else if (!e.isIntersecting && raf) { cancelAnimationFrame(raf); raf = 0; }
    }), { threshold: 0 }).observe(canvas);

    let rz;
    addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(size, 180); });
  }

  /* ------------------------------------------------------- the readings */
  /* The three hero numbers count up to the values already in the markup, so
     the text is correct before, during and after. Tabular figures keep the
     width fixed, so the layout cannot shift while it counts. */
  const mags = [...document.querySelectorAll(".mag b")];
  if (mags.length && !still) {
    const run = el => {
      const target = parseInt(el.textContent, 10);
      if (!Number.isFinite(target)) return;
      const dur = 900, t0 = performance.now();
      const step = now => {
        const k = Math.min((now - t0) / dur, 1);
        el.textContent = String(Math.round(target * (1 - Math.pow(1 - k, 3))));
        if (k < 1) requestAnimationFrame(step);
        else el.textContent = String(target);        // always land exactly
      };
      requestAnimationFrame(step);
    };
    const io = new IntersectionObserver(es => es.forEach(e => {
      if (!e.isIntersecting) return;
      run(e.target);
      io.unobserve(e.target);
    }), { threshold: .6 });
    mags.forEach(m => io.observe(m));
  }

  /* --------------------------------------------------------- the cards */
  /* Real 3D, not a fake shadow: .pgrid owns the perspective, each card is a
     preserve-3d layer, and the pointer drives its yaw and pitch. The title and
     metadata sit on their own planes, so they rise out of the card as it turns.
     This only writes custom properties and a transform — the CSS owns the look. */
  if (!still && matchMedia("(hover:hover)").matches) {
    const TILT = 5;
    document.addEventListener("pointermove", e => {
      const c = e.target.closest(".card");
      if (!c) return;
      const r = c.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width;
      const py = (e.clientY - r.top) / r.height;
      c.style.setProperty("--mx", (px * 100).toFixed(1) + "%");
      c.style.setProperty("--my", (py * 100).toFixed(1) + "%");
      c.style.transform =
        "rotateY(" + ((px - .5) * TILT * 2).toFixed(2) + "deg)" +
        " rotateX(" + ((.5 - py) * TILT * 2).toFixed(2) + "deg)";
    }, { passive: true });

    document.addEventListener("pointerout", e => {
      const c = e.target.closest?.(".card");
      if (c && !c.contains(e.relatedTarget)) c.style.transform = "";
    }, { passive: true });
  }

  /* ------------------------------------------------- the nav indicator */
  /* One rule that travels to the active link instead of a colour flicking on
     and off each one. Positioned from the link's own box, so it stays correct
     when the labels or the font change. */
  const links = document.querySelector(".nav-links");
  if (links && links.children.length) {
    const ind = document.createElement("span");
    ind.className = "nav-ind";
    links.append(ind);

    /* Every write is guarded. classList.add still queues a mutation record
       when the class is already present, so an unguarded version fed its own
       observer, starved the microtask queue and wedged the main thread. */
    const move = () => {
      const on = links.querySelector("a.on");
      if (!on) {
        if (ind.classList.contains("on")) ind.classList.remove("on");
        return;
      }
      const l = on.offsetLeft + "px", w2 = on.offsetWidth + "px";
      if (ind.style.left !== l) ind.style.left = l;
      if (ind.style.width !== w2) ind.style.width = w2;
      if (!ind.classList.contains("on")) ind.classList.add("on");
    };

    /* Each anchor is observed on its own rather than the whole subtree, so the
       indicator — which lives inside .nav-links — can never trigger this. */
    const mo = new MutationObserver(move);
    links.querySelectorAll("a").forEach(a =>
      mo.observe(a, { attributes: true, attributeFilter: ["class"] }));
    addEventListener("resize", move);
    move();
  }
}
</script>

</body>
</html>
