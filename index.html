<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laiba Mazhar</title>
<meta name="description" content="Data Scientist & ML Researcher — trustworthy and diagnosable ML systems.">
<meta name="theme-color" content="#08090b">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='12' y='12' width='76' height='76' fill='none' stroke='%235c6570' stroke-width='7'/><path d='M50 28V50h22' fill='none' stroke='%23c4d4e4' stroke-width='9'/></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@200;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
/* ==========================================================================
   INSTRUMENT

   Her work is measurement: decomposing an observed change into per-operator
   contributions. So the page is built like an instrument rather than a
   brochure — a metadata rail, hairline gauges with a needle at the reading,
   and type set for precision.

   The palette is deliberately achromatic and cold. There is one hue, a steel
   carrying metadata and live state, and it never exceeds low chroma. The
   emphasis colour here is light, not a hue: things brighten toward white
   rather than turning a colour. That is the whole reason this reads as an
   instrument and not a toy.

   Dark only, deliberately. Following the OS preference meant a light-mode
   machine got a white page nobody asked for. Every colour is painted
   explicitly so the page never borrows a ground.
   ========================================================================== */
:root{
  color-scheme: dark;

  --bg:#08090b;
  --surface:#0d0f13;
  --surface-2:#13161b;
  --line:#191d23;
  --line-2:#272d35;

  --ink:#f1f3f6;
  --ink-2:#97a0ab;
  --ink-3:#5c6570;

  /* the one hue on the page, kept at low chroma */
  --edge:#8fa6bf;
  --edge-lit:#c4d4e4;
  --edge-dim:rgba(143,166,191,.11);

  --maxw:1180px;
  --gut:40px;
  --rail:132px;         /* the metadata rail */
  --r:2px;              /* near-square: precision, not softness */

  --ease:cubic-bezier(.2,.7,.3,1);
  --out:cubic-bezier(.16,1,.3,1);

  --sans:"Archivo",ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --serif:var(--sans);   /* the slab serif is gone; alias kept for safety */
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:88px;-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);
  font:400 15.5px/1.6 var(--sans);
  letter-spacing:-.006em;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
ul{list-style:none}
::selection{background:var(--edge-lit);color:#0a0c10}
:focus-visible{outline:1px solid var(--edge-lit);outline-offset:3px;border-radius:var(--r)}

.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--gut)}
@media(max-width:860px){ :root{--gut:20px;--rail:0px} }

/* three voices: display, text, and the instrument's own labelling */
.ser{font-family:var(--sans);font-weight:700;letter-spacing:-.032em}
.mo{
  font-family:var(--mono);font-size:10.5px;font-weight:400;
  letter-spacing:.14em;text-transform:uppercase;font-variant-numeric:tabular-nums;
}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.skip{position:absolute;left:14px;top:-60px;z-index:200;background:var(--edge-lit);color:#0a0c10;
  padding:10px 16px;border-radius:var(--r);font-weight:600;font-size:14px;transition:top .2s}
.skip:focus{top:14px}

/* ============================================================== the gauge */
/* The page's one repeated device: a reading on a hairline scale with a needle
   at the value. Every instance is a real proportion of real content. */
.bar{position:relative;height:7px;width:100%}
.bar::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line-2)}
.bar i{
  position:absolute;left:0;top:50%;height:1px;width:0;background:var(--edge);
  transition:width 1.2s var(--out);
}
.bar i::after{                       /* the needle sitting at the reading */
  content:"";position:absolute;right:0;top:-3px;width:1px;height:7px;background:var(--edge-lit);
}
.in .bar i,.bar.on i{width:var(--w,0%)}

/* =================================================================== nav */
nav{
  position:sticky;top:0;z-index:80;
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(16px) saturate(140%);
  border-bottom:1px solid transparent;transition:border-color .35s,background .35s;
}
nav.stuck{border-bottom-color:var(--line)}
.nav-in{display:flex;align-items:center;gap:24px;height:68px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.brand svg{width:18px;height:18px;flex:none;overflow:visible}
.brand svg .fr{fill:none;stroke:var(--ink-3);stroke-width:5;transition:stroke .3s}
.brand svg .tk{fill:none;stroke:var(--edge-lit);stroke-width:7;stroke-linecap:square;
  transition:transform .55s var(--out);transform-origin:50% 50%}
.brand:hover svg .fr{stroke:var(--edge)}
.brand:hover svg .tk{transform:rotate(90deg)}
.brand b{font-weight:600;font-size:16px;letter-spacing:-.024em}

.nav-links{display:flex;gap:26px;position:relative;align-self:stretch;align-items:center}
.nav-links a{
  color:var(--ink-3);font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;
  text-transform:uppercase;white-space:nowrap;transition:color .25s;
}
.nav-links a:hover{color:var(--ink-2)}
.nav-links a.on{color:var(--ink)}
/* one rule that slides between sections, rather than a colour swapping on each */
.nav-ind{
  position:absolute;bottom:15px;left:0;width:0;height:1px;background:var(--edge-lit);
  opacity:0;transition:left .45s var(--out),width .45s var(--out),opacity .3s;
}
.nav-ind.on{opacity:1}
@media(max-width:1080px){ .nav-links{display:none} }

.ib{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line-2);
  border-radius:var(--r);color:var(--ink-2);flex:none;transition:border-color .25s,color .25s}
.ib:hover{border-color:var(--edge);color:var(--ink)}
.ib svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.5;
  stroke-linecap:square;stroke-linejoin:miter}
#burger{display:none}
@media(max-width:1080px){ #burger{display:grid} }
.nav-r{display:flex;align-items:center;gap:10px;flex:none}
@media(max-width:640px){ .nav-r .btn{display:none} }

/* ---------------------------------------------------------------- buttons */
.btn{
  display:inline-flex;align-items:center;gap:9px;padding:10px 18px;border-radius:var(--r);
  font-size:13.5px;font-weight:500;letter-spacing:-.008em;
  border:1px solid var(--line-2);color:var(--ink-2);position:relative;overflow:hidden;
  transition:border-color .3s,color .3s;
}
/* the fill wipes in from the left rather than snapping on */
.btn::before{
  content:"";position:absolute;inset:0;background:var(--edge-dim);
  transform:scaleX(0);transform-origin:left;transition:transform .45s var(--out);
}
.btn:hover{border-color:var(--edge);color:var(--ink)}
.btn:hover::before{transform:scaleX(1)}
.btn svg,.btn span{position:relative}
.btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.5;
  stroke-linecap:square;stroke-linejoin:miter;flex:none}
.btn.pri{background:var(--edge-lit);border-color:var(--edge-lit);color:#0a0c10;font-weight:600}
.btn.pri::before{background:#fff}
.btn.pri:hover{color:#0a0c10;border-color:#fff}

/* -------------------------------------------------------------- mobile nav */
.drawer{position:fixed;inset:0;z-index:95;background:var(--bg);display:flex;flex-direction:column;
  padding:16px var(--gut) 30px;opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.drawer.open{opacity:1;pointer-events:auto}
.dtop{display:flex;align-items:center;justify-content:space-between;height:54px}
.drawer ul{margin-top:16px;flex:1;overflow-y:auto}
.drawer li{border-bottom:1px solid var(--line)}
.drawer li a{display:flex;align-items:baseline;gap:16px;padding:16px 2px;
  font-weight:600;font-size:23px;letter-spacing:-.028em}
.drawer li a span{font-family:var(--mono);font-size:10px;color:var(--edge);flex:none;
  letter-spacing:.1em}
.dfoot{display:flex;flex-wrap:wrap;gap:8px;padding-top:18px}

/* ================================================================== hero */
header{padding:72px 0 76px;border-bottom:1px solid var(--line);position:relative;isolation:isolate}
@media(max-width:860px){ header{padding:36px 0 48px} }
/* an ambient scan field: slow, regular, generated rather than drawn */
.field{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;opacity:.6}
.hero{display:grid;grid-template-columns:1fr 250px;gap:56px;align-items:end}
@media(max-width:860px){ .hero{grid-template-columns:1fr;gap:32px} }

.eyebrow{display:flex;align-items:center;gap:14px;color:var(--edge);margin-bottom:26px}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line-2);max-width:200px;
  transform-origin:left}
h1{font-weight:700;letter-spacing:-.045em;line-height:.94;font-size:clamp(46px,7.2vw,90px)}
h1 em{font-style:normal;font-weight:200;color:var(--ink-3);letter-spacing:-.04em}
.tagline{font-size:clamp(16.5px,1.6vw,20px);line-height:1.45;margin-top:24px;max-width:32ch;
  color:var(--ink);font-weight:400}
.intro{color:var(--ink-2);margin-top:18px;max-width:66ch;font-size:15px}
.cta{display:flex;flex-wrap:wrap;gap:9px;margin-top:30px}

.portrait{position:relative}
.portrait img{width:100%;aspect-ratio:1/1;object-fit:cover;border:1px solid var(--line-2);
  border-radius:var(--r);filter:saturate(.5) contrast(1.08)}
.portrait .cap{display:flex;align-items:center;gap:9px;margin-top:12px;color:var(--ink-3)}
.portrait .cap b{width:4px;height:4px;background:var(--edge-lit);flex:none;border-radius:0}
@media(max-width:860px){ .portrait{max-width:156px} }

/* --- three readings off one baseline --- */
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:36px;margin-top:52px;
  padding-top:26px;border-top:1px solid var(--line)}
@media(max-width:640px){ .strip{grid-template-columns:1fr;gap:20px} }
.mag b{font-family:var(--mono);font-weight:500;font-size:38px;line-height:1;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums;display:block;color:var(--ink)}
.mag .lb{color:var(--ink-3);margin:10px 0 12px;display:block}

/* ============================================================== sections */
main section{padding:48px 0;border-bottom:1px solid var(--line);position:relative}
@media(max-width:860px){ main section{padding:40px 0} }
.s-head{display:grid;grid-template-columns:var(--rail) 1fr;gap:0;margin-bottom:28px;
  align-items:baseline}
.s-head .ix{color:var(--edge)}
h2{font-weight:600;letter-spacing:-.034em;line-height:1;font-size:clamp(25px,3.2vw,38px)}
.s-head .rt{margin-left:auto;color:var(--ink-3);text-align:right}
.s-head .hb{display:flex;align-items:baseline;gap:18px}
@media(max-width:860px){
  .s-head{grid-template-columns:1fr;gap:12px}
  .s-head .ix{display:block}
}

/* --- a row on the instrument: reading in the rail, content in the body --- */
.led{display:grid;grid-template-columns:var(--rail) 1fr;gap:0;
  padding:28px 0;border-top:1px solid var(--line);position:relative}
.led:first-child{border-top:0;padding-top:0}
.led:last-child{padding-bottom:0}
/* a tick creeps out of the rail as the row is pointed at */
.led::before{
  content:"";position:absolute;left:0;top:28px;width:0;height:1px;background:var(--edge-lit);
  transition:width .5s var(--out);
}
.led:hover::before{width:22px}
.led-g{color:var(--ink-3);padding-right:22px;transition:transform .5s var(--out)}
.led:hover .led-g{transform:translateX(30px)}
.led-g .k{display:block}
.led-g .bar{margin-top:12px;max-width:62px}
@media(max-width:860px){
  .led{grid-template-columns:1fr;gap:12px;padding:22px 0}
  .led::before{display:none}
  .led:hover .led-g{transform:none}
  .led-g{padding-right:0;display:flex;align-items:center;gap:14px}
  .led-g .bar{margin-top:0;flex:1;max-width:90px}
}

/* =============================================================== research */
.led h3{font-weight:600;font-size:clamp(18px,2vw,23px);
  line-height:1.26;letter-spacing:-.03em;max-width:42ch;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;
  transition:color .3s}
.led:hover h3{color:var(--edge-lit)}
.who{color:var(--ink-2);font-size:13.5px;margin-top:10px}
.st{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--edge);border:1px solid var(--line-2);
  padding:3px 8px;border-radius:var(--r);margin-left:10px;white-space:nowrap}
/* An abstract runs to a full paragraph, and four of them turned Research into
   two and a half screens. Clamped to a preview; the full text is in the paper. */
.abs{color:var(--ink-2);font-size:14.5px;margin-top:13px;max-width:78ch;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.row{display:flex;gap:20px;margin-top:15px;flex-wrap:wrap}
.lnk{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:500;
  font-family:var(--mono);letter-spacing:.11em;color:var(--edge-lit);text-transform:uppercase}
.lnk::after{content:"";width:14px;height:1px;background:currentColor;
  transition:width .35s var(--out)}
.lnk:hover::after{width:28px}

/* ================================================================== tags */
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:15px}
.tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--ink-3);
  border:1px solid var(--line);padding:4px 8px;border-radius:var(--r);white-space:nowrap;
  text-transform:uppercase;transition:color .25s,border-color .25s}
.tag:hover{color:var(--edge-lit);border-color:var(--line-2)}

/* ============================================================ org marks */
.org-line{display:flex;align-items:center;gap:14px}
.mark{width:38px;height:38px;flex:none;display:grid;place-items:center;padding:6px;
  background:var(--ink);border-radius:var(--r);transition:transform .5s var(--out)}
.mark img{max-width:100%;max-height:100%;object-fit:contain}
.mark .mg{font-family:var(--mono);font-size:12px;font-weight:500;color:#0a0c10}
.led:hover .mark{transform:scale(1.05)}
.orgn{color:var(--edge);font-size:14.5px;font-weight:500}
.where{color:var(--ink-3);font-size:12.5px;margin-top:3px}
.det{color:var(--ink-2);font-size:14px;margin-top:12px}
.led ul{margin-top:14px}
.led li{color:var(--ink-2);font-size:14.5px;padding-left:18px;position:relative;
  margin-bottom:7px;max-width:76ch}
.led li::before{content:"";position:absolute;left:0;top:10px;width:8px;height:1px;
  background:var(--line-2)}

/* =============================================================== projects */
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px}
/* Six chips wrap to four rows on a phone, which cost more height than the two
   cards below them. One scrolling row instead. */
@media(max-width:860px){
  .filters{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;
    margin-inline:calc(var(--gut) * -1);padding-inline:var(--gut);
    scroll-snap-type:x proximity}
  .filters::-webkit-scrollbar{display:none}
  .chip{flex:none;scroll-snap-align:start}
}
.chip{border:1px solid var(--line);color:var(--ink-3);padding:7px 13px;border-radius:var(--r);
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  transition:border-color .25s,color .25s,background .25s}
.chip .n{opacity:.5;margin-left:8px}
.chip:hover{border-color:var(--line-2);color:var(--ink-2)}
.chip.on{border-color:var(--edge-lit);color:var(--ink);background:var(--edge-dim)}
.chip.on .n{opacity:.8}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(292px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card{background:var(--bg);padding:24px;display:flex;flex-direction:column;
  position:relative;transition:background .35s}
.card:hover{background:var(--surface)}
/* a specular sheen that tracks the pointer, on top of the tilt */
.card::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),
    rgba(196,212,228,.07),transparent 62%);
  transition:opacity .45s var(--ease);
}
.card:hover::after{opacity:1}
.card>*{position:relative;z-index:1}
.card .pk{color:var(--edge-lit);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card .pk::before{content:"";width:4px;height:4px;background:currentColor;flex:none}
.card h3{font-weight:600;font-size:16.5px;letter-spacing:-.026em;
  line-height:1.3;display:flex;align-items:flex-start;gap:10px;transition:color .3s}
.card:hover h3{color:var(--edge-lit)}
.card .aw{margin-left:auto;flex:none;color:var(--ink-3);font-size:12px;
  transition:transform .35s var(--out),color .3s}
.card:hover .aw{transform:translate(4px,-4px);color:var(--edge-lit)}
.card p{color:var(--ink-2);font-size:14px;margin-top:10px;flex:1}
.none{color:var(--ink-3);padding:24px 0}

/* Rows beyond the cap arrive on demand, so a section opens at about one
   screen. The cap applies inside whatever the filters have narrowed to. */
.more-wrap{display:flex;justify-content:center;margin-top:22px}
.more-wrap.off{display:none}
.more{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase}
.more svg{transition:transform .4s var(--out)}
.more.open svg{transform:rotate(180deg)}
/* revealed rows unfold instead of popping into place */
@keyframes unfold{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
/* No fill mode on purpose. With `both` the row holds the keyframe's opacity:0
   until the animation actually starts, so anywhere animations are deferred the
   content sits there invisible. Unfilled, the natural state is visible and the
   animation only overrides while it plays. */
.lifted{animation:unfold .5s var(--out)}

/* ================================================================= skills */
/* Each group's gauge is its share of the listed skills — real information, so
   it is drawn rather than merely printed. */
.sk{padding:20px 0;border-top:1px solid var(--line)}
.sk:first-child{border-top:0;padding-top:0}
.sk-h{display:grid;grid-template-columns:var(--rail) 1fr auto;gap:0;align-items:center;
  margin-bottom:13px}
.sk-h .g{color:var(--ink);font-weight:500}
.sk-h .bw{max-width:210px;margin:0 20px}
.sk-h .ct{color:var(--ink-3);font-family:var(--mono);font-size:10.5px}
@media(max-width:860px){
  .sk-h{grid-template-columns:1fr auto;gap:10px}
  .sk-h .bw{grid-column:1/-1;max-width:none;margin:6px 0 0;order:3}
}
.sk-i{display:flex;flex-wrap:wrap;gap:5px;padding-left:var(--rail)}
@media(max-width:860px){ .sk-i{padding-left:0} }
.sk-i span{font-size:12.5px;color:var(--ink-2);background:var(--surface);
  border:1px solid var(--line);padding:4px 9px;border-radius:var(--r);
  transition:color .25s,border-color .25s,background .25s}
.sk-i span:hover{color:var(--ink);border-color:var(--line-2);background:var(--surface-2)}

/* ================================================================= awards */
.awd{display:grid;grid-template-columns:var(--rail) 1fr;padding:13px 0;
  border-top:1px solid var(--line);font-size:14.5px;align-items:baseline;
  transition:padding-left .4s var(--out)}
.awd:first-child{border-top:0}
.awd:hover{padding-left:12px}
.awd .y{color:var(--ink-3);font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
  transition:color .3s}
.awd:hover .y{color:var(--edge-lit)}
@media(max-width:860px){ .awd{grid-template-columns:1fr;gap:4px} .awd .y{order:-1} }

/* ============================================================= activities */
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.act{background:var(--bg);padding:21px;position:relative;transition:background .35s}
.act:hover{background:var(--surface)}
.act::before{content:"";position:absolute;left:0;top:0;bottom:0;width:1px;
  background:var(--edge-lit);transform:scaleY(0);transform-origin:top;
  transition:transform .45s var(--out)}
.act:hover::before{transform:scaleY(1)}
.act h3{font-weight:600;font-size:15.5px;letter-spacing:-.024em;line-height:1.34;
  transition:color .3s}
.act:hover h3{color:var(--edge-lit)}
.act p{color:var(--ink-2);font-size:13.5px;margin-top:8px}
.g-label{display:flex;align-items:center;gap:16px;color:var(--ink-3);margin:34px 0 16px}
.g-label::after{content:"";flex:1;height:1px;background:var(--line)}
.g-label:first-child{margin-top:0}

/* ==================================================== interests & langs */
.two{display:grid;grid-template-columns:1fr 1fr;gap:52px}
@media(max-width:780px){ .two{grid-template-columns:1fr;gap:32px} }
.ch{color:var(--ink-3);margin-bottom:18px}
.lg{padding:12px 0;border-top:1px solid var(--line)}
.lg:first-of-type{border-top:0}
.lg-t{display:flex;align-items:baseline;gap:14px}
.lg-t b{font-weight:600;font-size:15.5px;letter-spacing:-.024em}
.lg-t span{color:var(--ink-3);font-size:12.5px;margin-left:auto;text-align:right}
.lg .bar{margin-top:10px;max-width:190px}

/* ================================================================= footer */
footer{padding:80px 0 52px}
.fcta{font-weight:700;letter-spacing:-.042em;line-height:1.02;
  font-size:clamp(30px,5.2vw,58px);max-width:24ch}
.fcta em{font-style:normal;font-weight:200;color:var(--ink-3)}
.mail{display:inline-flex;align-items:center;gap:14px;margin-top:30px;
  font-size:clamp(16px,2vw,22px);font-family:var(--mono);letter-spacing:-.02em;
  border-bottom:1px solid var(--line-2);padding-bottom:7px;
  transition:color .3s,border-color .3s}
.mail:hover{color:var(--edge-lit);border-bottom-color:var(--edge-lit)}
.mail small{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);border:1px solid var(--line-2);border-radius:var(--r);padding:3px 7px}
.fbar{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-top:52px;padding-top:22px;
  border-top:1px solid var(--line);color:var(--ink-3);font-size:12.5px}
.flinks{display:flex;gap:20px;flex-wrap:wrap;margin-left:auto}
.flinks a{color:var(--ink-2);font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;transition:color .25s}
.flinks a:hover{color:var(--edge-lit)}

/* ================================================================= to top */
.top{position:fixed;right:18px;bottom:18px;z-index:70;width:38px;height:38px;
  border-radius:var(--r);border:1px solid var(--line-2);background:var(--surface);
  color:var(--ink-2);display:grid;place-items:center;opacity:0;pointer-events:none;
  transform:translateY(8px);transition:opacity .35s,transform .35s,border-color .25s,color .25s}
.top.show{opacity:1;pointer-events:auto;transform:none}
.top:hover{border-color:var(--edge);color:var(--ink)}
.top svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.5;
  stroke-linecap:square;stroke-linejoin:miter}

/* ================================================================= reveal */
/* Visible by default. Only hidden while `reveal-on` sits on <html>, which JS
   adds after confirming IntersectionObserver works and removes if it never
   fires. A scroll animation must degrade to "shown", never to a blank page. */
.rv{transition:opacity .7s var(--out),transform .7s var(--out)}
html.reveal-on .rv:not(.in){opacity:0;transform:translateY(16px)}

/* ============================================================== the boot */
/* The page comes up like an instrument: the rule draws across, then the type
   settles in behind it. One orchestrated sequence, not scattered effects. */
@keyframes drawX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes settle{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* Unfilled here too: the hero must be readable even if the entrance never
   plays. Delays stay, because an unfilled delay simply shows the real style. */
html.boot nav{animation:fade .5s var(--ease)}
html.boot .eyebrow::after{animation:drawX .9s var(--out) .45s}
html.boot .hero>div>*{animation:settle .85s var(--out)}
html.boot .hero>div>*:nth-child(1){animation-delay:.10s}
html.boot .hero>div>*:nth-child(2){animation-delay:.18s}
html.boot .hero>div>*:nth-child(3){animation-delay:.26s}
html.boot .hero>div>*:nth-child(4){animation-delay:.34s}
html.boot .hero>div>*:nth-child(5){animation-delay:.42s}
html.boot .portrait{animation:settle 1s var(--out) .3s}
html.boot .strip{animation:fade .9s var(--ease) .55s}
html.boot .field{animation:fade 1.6s var(--ease) .2s}

/* ======================================================== reduced motion */
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important}
  html.reveal-on .rv{opacity:1!important;transform:none!important;transition:none!important}
  .bar i{transition:none}
  .led:hover .led-g,.card:hover .aw,.mark,.brand:hover svg .tk{transform:none!important}
  .awd:hover{padding-left:0}
  .field{display:none}
}
/* A pointerless device must not keep hover states stuck on. */
@media (hover:none){
  .led:hover .led-g{transform:none}
  .awd:hover{padding-left:0}
  .card::after{display:none}
}

/* ============================================================== utilities */
/* Last in the sheet on purpose. Rows collapsed by a "show more" button carry
   .gone, and several of them (.led, .awd, .acts children) set their own
   display, so this has to win on order rather than reach for !important. */
.gone{display:none}
</style>
</head>
<body>

<a class="skip" href="#main">Skip to content</a>

<nav id="nav">
  <div class="wrap nav-in">
    <a href="#top" class="brand" aria-label="Back to top">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <rect class="fr" x="10" y="10" width="80" height="80"/>
        <path class="tk" d="M50 26V50h24"/>
      </svg>
      <b id="nav-name"></b>
    </a>
    <div class="nav-links" id="navlinks"></div>
    <div class="nav-r">
      <a class="btn pri" id="nav-cv" href="#" hidden>Curriculum Vitae</a>
      <button class="ib" id="burger" aria-label="Open menu" aria-expanded="false" aria-controls="drawer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
</nav>

<div class="drawer" id="drawer" aria-hidden="true">
  <div class="dtop">
    <b class="ser" id="drawer-name" style="font-size:18px"></b>
    <button class="ib" id="dclose" aria-label="Close menu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <ul id="dlinks"></ul>
  <div class="dfoot" id="dfoot"></div>
</div>

<span id="top"></span>

<header class="wrap">
  <canvas class="field" aria-hidden="true"></canvas>
  <div class="hero">
    <div>
      <div class="eyebrow mo" id="h-eyebrow"></div>
      <h1 id="h-name"></h1>
      <p class="tagline" id="h-tag"></p>
      <p class="intro" id="h-intro"></p>
      <div class="cta" id="h-cta"></div>
    </div>
    <div class="portrait" id="h-portrait"></div>
  </div>
  <div class="strip" id="h-strip"></div>
</header>

<main id="main"></main>

<footer>
  <div class="wrap">
    <h2 class="fcta">Looking for someone who can tell you <em>which part broke.</em></h2>
    <a class="mail" id="fmail" href="#"></a>

      <span id="fnote"></span>
      <div class="flinks" id="flinks"></div>
    </div>
  </div>
</footer>

<button class="top" id="totop" aria-label="Back to top">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg>
</button>

<script>
/* The local preview server sends no Cache-Control, so browsers keep serving a
   stale data.js after every edit. On localhost we add a timestamp; in
   production the URL stays clean. */
(() => {
  const dev = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
  const tag = document.createElement("script");
  tag.src = "data.js" + (dev ? "?t=" + Date.now() : "");
  tag.onload = () => boot();
  tag.onerror = () => document.body.innerHTML =
    '<p style="padding:40px;font:16px sans-serif">Could not load data.js</p>';
  document.head.append(tag);
})();
</script>

<script>
function boot(){
const $ = id => document.getElementById(id);
const el = (t, c, txt) => { const n = document.createElement(t); if (c) n.className = c;
  if (txt !== undefined) n.textContent = txt; return n; };
const tidy = s => String(s ?? "").replace(/\s+/g, " ").trim();
const ext = (a, u) => { a.href = u; a.target = "_blank"; a.rel = "noopener noreferrer"; return a; };

const SVGNS = "http://www.w3.org/2000/svg";
const icon = d => {
  const s = document.createElementNS(SVGNS, "svg");
  s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("aria-hidden", "true");
  const p = document.createElementNS(SVGNS, "path"); p.setAttribute("d", d);
  s.append(p); return s;
};
const ICON = {
  cv:'M14 3v5h5M13.5 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8.5Z',
  email:'M3 7.5A1.5 1.5 0 0 1 4.5 6h15A1.5 1.5 0 0 1 21 7.5v9A1.5 1.5 0 0 1 19.5 18h-15A1.5 1.5 0 0 1 3 16.5ZM3.6 7l8.4 6 8.4-6',
  github:'M9 19c-4 1.4-4-2.1-5.5-2.6m11.5 5v-3.6a3 3 0 0 0-.9-2.4c2.9-.3 4.9-1.5 4.9-5.2a4 4 0 0 0-1.1-2.8 3.7 3.7 0 0 0-.1-2.8s-1.2-.4-3.8 1.4a9.3 9.3 0 0 0-5 0C6.4 3.4 5.2 3.8 5.2 3.8a3.7 3.7 0 0 0-.1 2.8A4 4 0 0 0 4 9.4c0 3.7 2 4.9 4.9 5.2a3 3 0 0 0-.9 2.3V21',
  linkedin:'M6.5 9.5V18M6.5 6.2v.1M11 18v-4.8a2.7 2.7 0 0 1 5.4 0V18M3 4.5h18v15H3Z',
  scholar:'M12 3 2 8.5 12 14l10-5.5ZM6 11v5.5c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5V11',
};

/* a magnitude bar: width is a real proportion, animated in on reveal */
const mkBar = (pct, cool) => {
  const b = el("div", "bar" + (cool ? " cool" : ""));
  b.style.setProperty("--w", Math.max(3, Math.min(100, pct)) + "%");
  b.append(el("i"));
  return b;
};

document.title = DATA.name;
$("nav-name").textContent = DATA.name;
$("drawer-name").textContent = DATA.name;
if (DATA.title) $("h-eyebrow").textContent = DATA.title;

/* first name upright, surname in the serif italic */
const parts = String(DATA.name).split(/\s+/);
$("h-name").append(document.createTextNode(parts[0]));
if (parts.length > 1) {
  $("h-name").append(document.createTextNode(" "),
    el("em", "", parts.slice(1).join(" ")));
}
$("h-tag").textContent = DATA.tagline;
$("h-intro").textContent = tidy(DATA.intro);

/* ---------------------------------------------------------------- portrait */
if (DATA.photo?.src) {
  const img = new Image();
  img.src = DATA.photo.src; img.alt = DATA.photo.alt || DATA.name;
  img.onerror = () => $("h-portrait").remove();     // never leave a broken image
  $("h-portrait").append(img);
  if (DATA.location) {
    const cap = el("div", "cap mo");
    cap.append(el("b"), document.createTextNode(DATA.location));
    $("h-portrait").append(cap);
  }
} else $("h-portrait").remove();

/* ------------------------------------------------------------------- links */
const L = DATA.links || {};
const links = [
  L.cv       && { t:"Curriculum Vitae", u:L.cv, k:"cv", pri:true },
  L.email    && { t:"Email",    u:"mailto:" + L.email, k:"email" },
  L.github   && { t:"GitHub",   u:L.github,   k:"github" },
  L.linkedin && { t:"LinkedIn", u:L.linkedin, k:"linkedin" },
  L.scholar  && { t:"Scholar",  u:L.scholar,  k:"scholar" },
].filter(Boolean);

const mkBtn = x => {
  const a = el("a", "btn" + (x.pri ? " pri" : ""));
  a.append(icon(ICON[x.k]), document.createTextNode(x.t));
  if (x.u.startsWith("mailto")) a.href = x.u; else ext(a, x.u);
  return a;
};
links.forEach(x => $("h-cta").append(mkBtn(x)));
if (L.cv) { const b = $("nav-cv"); ext(b, L.cv); b.hidden = false; } else $("nav-cv").remove();

/* --------------------------------------------------------- ledger strip */
/* Three counts, each drawn against the largest of them so the bars compare. */
const mags = [
  [DATA.research?.length, "research manuscripts"],
  [DATA.projects?.length, "projects built"],
  [DATA.awards?.length,   "awards & honours"],
].filter(([n]) => n);
const peak = Math.max(...mags.map(([n]) => n), 1);
mags.forEach(([n, label], i) => {
  const d = el("div", "mag rv");
  d.append(el("b", "", String(n)), el("span", "lb mo", label), mkBar(n / peak * 100, i === 2));
  $("h-strip").append(d);
});

/* ====================================================== section machinery */
const main = $("main"), navl = $("navlinks"), dl = $("dlinks");
let n = 0;

function section(id, title, node, opts = {}) {
  if (!node) return;
  n++;
  const num = String(n).padStart(2, "0");
  const s = el("section"); s.id = id;
  const w = el("div", "wrap");

  const head = el("div", "s-head rv");
  head.append(el("span", "ix mo", num));
  const hb = el("div", "hb");
  hb.append(el("h2", "", title));
  if (opts.count) hb.append(el("span", "rt mo", opts.count));
  head.append(hb);
  w.append(head, node); s.append(w); main.append(s);

  const label = opts.nav || title;
  const a = el("a", "", label); a.href = "#" + id; navl.append(a);
  const li = el("li"), a2 = el("a");
  a2.href = "#" + id;
  a2.append(el("span", "", num), document.createTextNode(label));
  li.append(a2); dl.append(li);
}

const monogram = name => {
  const s = String(name).replace(/^TODO.*/i, "?").trim();
  const words = s.split(/\s+/).filter(w => w.length > 2 && !/^(of|and|the|for)$/i.test(w));
  if (words.length > 1) return words.slice(0, 2).map(w => w[0].toUpperCase()).join("");
  // A single word gives a single letter, which reads as a typo. Prefer its own
  // internal capitals — AiPixal becomes AP — and fall back to its first two.
  const one = words[0] || s;
  const caps = one.match(/[A-Z]/g);
  return caps && caps.length > 1 ? caps.slice(0, 2).join("") : one.slice(0, 2).toUpperCase();
};

function orgMark(logo, org) {
  const m = el("div", "mark");
  if (logo) {
    const img = new Image();
    img.src = logo; img.alt = org + " logo"; img.decoding = "async";
    // A monogram stands in if the file 404s, so nothing renders as broken.
    img.onerror = () => { m.textContent = ""; m.append(el("span", "mg", monogram(org))); };
    m.append(img);
  } else m.append(el("span", "mg", monogram(org)));
  return m;
}
const tagRow = list => { const t = el("div", "tags");
  list.forEach(x => t.append(el("span", "tag", x))); return t; };

/* ------------------------------------------------------------- one screen */
/* Every long list keeps `show` rows and puts the rest behind a button, so a
   section lands in roughly a screen instead of scrolling for three.
   `lift` marks button-revealed rows as shown: they carry the scroll-reveal
   class and the observer already passed over them while they were display:none,
   so without it they unhide at zero opacity and sit there blank. */
const noMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
/* A row that sits in a three-column grid on a desktop stacks to full width on
   a phone, so the same count is two or three times as tall. Each section
   therefore keeps fewer rows on a narrow screen. Read once at boot: this only
   sets the opening count, and re-deriving it on resize would fight whatever
   the reader had already opened. */
const narrow = matchMedia("(max-width: 860px)").matches;
/* "Show 1 more degrees" reads as a bug, so the noun agrees with the count. */
const plural = (n, word) => n === 1 ? word.replace(/ies$/, "y").replace(/s$/, "") : word;
const keep = (wide, thin) => narrow ? thin : wide;

function moreBar(label, onToggle) {
  const wrap = el("div", "more-wrap rv");
  const btn = el("button", "btn more");
  const txt = el("span");
  btn.append(txt, icon("M6 9.5l6 6 6-6"));
  wrap.append(btn);
  btn.onclick = () => onToggle(wrap, btn, txt);
  return { wrap, btn, txt, label };
}

function collapse(box, sel, show, noun, after) {
  const rows = [...box.querySelectorAll(sel)];
  if (rows.length <= show) return null;
  let open = false;

  const paint = lift => {
    rows.forEach((r, i) => {
      const vis = open || i < show;
      r.classList.toggle("gone", !vis);
      if (vis && lift) { r.classList.add("in"); r.classList.add("lifted"); }
    });
    if (after) after();
    const rest = rows.length - show;
    txt.textContent = open ? "Show fewer" : `Show ${rest} more ${plural(rest, noun)}`;
    btn.classList.toggle("open", open);
    btn.setAttribute("aria-expanded", String(open));
  };

  const { wrap, btn, txt } = moreBar("", () => {
    open = !open;
    paint(true);
    // Collapsing shortens the page under the reader, so bring the button back.
    if (!open) wrap.scrollIntoView({ block: "nearest",
      behavior: noMotion() ? "auto" : "smooth" });
  });

  paint(false);
  box.append(wrap);
  return wrap;
}

/* a ledger row: gutter keys on the left, content on the right */
const ledger = (keys, body) => {
  const d = el("div", "led rv");
  const g = el("div", "led-g mo");
  keys.filter(Boolean).forEach(k => g.append(typeof k === "string" ? el("span", "k", k) : k));
  d.append(g, body);
  return d;
};

/* =============================================================== research */
if (DATA.research?.length) {
  const box = el("div");
  DATA.research.forEach((p, i) => {
    const b = el("div");
    b.append(el("h3", "", p.title));
    const who = el("p", "who", `${p.authors} · ${p.year}`);
    if (p.status) who.append(el("span", "st", p.status));
    b.append(who);
    if (p.abstract) b.append(el("p", "abs", tidy(p.abstract)));
    if (p.tags?.length) b.append(tagRow(p.tags));
    if (p.links?.length) {
      const r = el("div", "row");
      p.links.forEach(x => r.append(ext(el("a", "lnk", x.label), x.url)));
      b.append(r);
    }
    box.append(ledger([String(i + 1).padStart(2, "0"), p.year], b));
  });
  collapse(box, ".led", keep(2, 2), "manuscripts");
  section("research", "Research", box, { count: DATA.research.length + " manuscripts" });
}

/* ============================================================== education */
if (DATA.education?.length) {
  const box = el("div");
  DATA.education.forEach(e => {
    const b = el("div");
    const line = el("div", "org-line");
    line.append(orgMark(e.logo, e.org));
    const t = el("div");
    t.append(el("h3", "", e.degree), el("div", "orgn", e.org));
    if (e.place) t.append(el("div", "where", e.place));
    line.append(t); b.append(line);
    if (e.detail) b.append(el("div", "det", e.detail));
    if (e.courses?.length) b.append(tagRow(e.courses));
    box.append(ledger([e.period], b));
  });
  collapse(box, ".led", keep(3, 2), "degrees");
  section("education", "Education", box);
}

/* ============================================================= experience */
if (DATA.experience?.length) {
  const box = el("div");
  DATA.experience.forEach(j => {
    const b = el("div");
    const line = el("div", "org-line");
    line.append(orgMark(j.logo, j.org));
    const t = el("div");
    t.append(el("h3", "", j.role), el("div", "orgn", j.org));
    if (j.place) t.append(el("div", "where", j.place));
    line.append(t); b.append(line);
    if (j.points?.length) {
      const ul = el("ul");
      j.points.forEach(p => ul.append(el("li", "", tidy(p))));
      b.append(ul);
    }
    if (j.stack?.length) b.append(tagRow(j.stack));
    box.append(ledger([j.period], b));
  });
  collapse(box, ".led", keep(2, 2), "roles");
  section("experience", "Experience", box, { count: DATA.experience.length + " roles" });
}

/* =============================================================== projects */
/* Six show first and the rest arrive on a button. The filters narrow the set,
   the cap applies inside whatever is left, and picking a filter starts over at
   six — so "show more" always refers to the list actually on screen. */
if (DATA.projects?.length) {
  const STEP = keep(3, 2);
  const box = el("div");
  const cats = [...new Set(DATA.projects.map(p => p.category || "Other"))];
  const nFeat = DATA.projects.filter(p => p.featured).length;

  const card = p => {
    const c = el(p.url ? "a" : "div", "card rv");
    c.dataset.cat = p.category || "Other";
    c.dataset.pick = p.featured ? "1" : "";
    if (p.url) ext(c, p.url);
    if (p.featured) c.append(el("div", "pk mo", "Selected"));
    const h = el("h3", "", p.name);
    if (p.url) h.append(el("span", "aw", "↗"));
    c.append(h, el("p", "", tidy(p.blurb)));
    if (p.stack?.length) c.append(tagRow(p.stack));
    return c;
  };

  const filters = el("div", "filters rv");
  const grid = el("div", "pgrid");
  const none = el("p", "none", "Nothing here yet.");
  none.style.display = "none";

  [...DATA.projects].sort((a, b) => (b.featured ? 1 : 0) - (a.featured ? 1 : 0))
    .forEach(p => grid.append(card(p)));

  const defs = [
    { k:"*", label:"All", n:DATA.projects.length },
    nFeat && { k:"@", label:"Selected", n:nFeat },
    ...cats.map(c => ({ k:c, label:c,
      n:DATA.projects.filter(p => (p.category || "Other") === c).length })),
  ].filter(Boolean);

  let filter = "*", cap = STEP;
  const hit = c => filter === "*" ? true
                 : filter === "@" ? c.dataset.pick === "1"
                 : c.dataset.cat === filter;
  const nHit = () => [...grid.querySelectorAll(".card")].filter(hit).length;

  const moreWrap = el("div", "more-wrap rv");
  const moreBtn  = el("button", "btn more");
  const moreTxt  = el("span");
  moreBtn.append(moreTxt, icon("M6 9.5l6 6 6-6"));
  moreWrap.append(moreBtn);

  /* `lift` marks the cards as revealed by the button rather than by scrolling.
     Without it a card unhidden below the fold keeps the reveal transform and
     sits there at zero opacity, because the observer already passed it by. */
  const paint = lift => {
    let n = 0;
    grid.querySelectorAll(".card").forEach(c => {
      if (!hit(c)) { c.classList.add("gone"); return; }
      n++;
      const vis = n <= cap;
      c.classList.toggle("gone", !vis);
      if (vis && lift) { c.classList.add("in"); c.classList.add("lifted"); }
    });
    none.style.display = n ? "none" : "block";

    const rest = Math.max(0, n - cap);
    moreWrap.classList.toggle("off", n <= STEP);
    moreBtn.classList.toggle("open", rest === 0);
    moreTxt.textContent = rest ? `Show ${rest} more ${plural(rest, "projects")}` : "Show fewer";
    moreBtn.setAttribute("aria-expanded", String(rest === 0));
  };

  moreBtn.onclick = () => {
    const n = nHit();
    const collapsing = cap >= n;
    cap = collapsing ? STEP : n;
    paint(true);
    // Collapsing shortens the page under the reader, so bring the button back.
    if (collapsing) moreWrap.scrollIntoView({ block: "nearest",
      behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  };

  defs.forEach((d, i) => {
    const b = el("button", "chip" + (i === 0 ? " on" : ""));
    b.append(document.createTextNode(d.label), el("span", "n", String(d.n)));
    b.onclick = () => {
      filters.querySelectorAll(".chip").forEach(x => x.classList.remove("on"));
      b.classList.add("on");
      filter = d.k; cap = STEP;      // a new filter starts the count over
      paint(true);
    };
    filters.append(b);
  });

  paint(false);
  box.append(filters, grid, none, moreWrap);
  section("projects", "Projects", box, { count: DATA.projects.length + " total" });
}

/* ================================================================= skills */
if (DATA.skills?.length) {
  const box = el("div");
  const top = Math.max(...DATA.skills.map(s => s.items.length), 1);
  DATA.skills.forEach(s => {
    const d = el("div", "sk rv");
    const h = el("div", "sk-h");
    const bw = el("div", "bw");
    bw.append(mkBar(s.items.length / top * 100));
    h.append(el("div", "g mo", s.group), bw,
      el("div", "ct", s.items.length + " / " + top));
    const i = el("div", "sk-i");
    s.items.forEach(x => i.append(el("span", "", x)));
    d.append(h, i); box.append(d);
  });
  const total = DATA.skills.reduce((a, s) => a + s.items.length, 0);
  collapse(box, ".sk", keep(3, 2), "areas");
  section("skills", "Skills", box, { count: total + " across " + DATA.skills.length + " areas" });
}

/* ================================================================= awards */
if (DATA.awards?.length) {
  const box = el("div");
  DATA.awards.forEach(a => {
    const d = el("div", "awd rv");
    d.append(el("div", "y", a.year), el("div", "", a.text));
    box.append(d);
  });
  collapse(box, ".awd", keep(5, 4), "entries");
  section("awards", "Awards", box, { count: DATA.awards.length + " entries" });
}

/* ============================================================= activities */
if (DATA.activities?.length) {
  const box = el("div");
  const groups = new Map();
  DATA.activities.forEach(a => {
    const k = a.group || "Other";
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(a);
  });
  groups.forEach((items, label) => {
    if (groups.size > 1) box.append(el("h3", "g-label mo rv", label));
    const g = el("div", "acts");
    items.forEach(a => {
      const d = el("div", "act rv");
      const h = el("h3");
      if (a.url) { const k = ext(el("a", "", a.title), a.url); k.append(el("span", "", " ↗")); h.append(k); }
      else h.textContent = a.title;
      d.append(h, el("p", "", tidy(a.text)));
      g.append(d);
    });
    box.append(g);
  });
  /* Rows collapse across groups, so a label whose grid emptied has to go too. */
  collapse(box, ".act", keep(4, 3), "entries", () => {
    box.querySelectorAll(".acts").forEach(g => {
      const empty = ![...g.children].some(c => !c.classList.contains("gone"));
      g.classList.toggle("gone", empty);
      const lab = g.previousElementSibling;
      if (lab && lab.classList.contains("g-label")) lab.classList.toggle("gone", empty);
    });
  });
  section("activities", "Community", box, { nav: "Community" });
}

/* ==================================================== interests & langs */
if (DATA.interests?.length || DATA.languages?.length) {
  const box = el("div", "two");
  if (DATA.interests?.length) {
    const c = el("div", "rv");
    c.append(el("div", "ch mo", "Interests"));
    const t = tagRow(DATA.interests); t.style.marginTop = "0";
    c.append(t); box.append(c);
  }
  if (DATA.languages?.length) {
    // The level is read straight off her own wording — nothing inferred beyond it.
    const lvl = s => /native/i.test(s) ? 100 : /basic/i.test(s) ? 40
                   : /fluent|professional/i.test(s) ? 80 : 60;
    const c = el("div", "rv");
    c.append(el("div", "ch mo", "Languages"));
    DATA.languages.forEach(l => {
      const d = el("div", "lg"), t = el("div", "lg-t");
      t.append(el("b", "", l.name), el("span", "", l.level));
      d.append(t, mkBar(lvl(l.level), true));
      c.append(d);
    });
    box.append(c);
  }
  section("interests", "Interests", box, { nav: "Interests" });
}

/* ================================================================= footer */
if (L.email) {
  const m = $("fmail");
  m.href = "mailto:" + L.email;
  m.append(document.createTextNode(L.email), el("small", "", "copy"));
  const badge = m.querySelector("small");
  m.addEventListener("click", ev => {
    if (!navigator.clipboard) return;                  // fall through to mailto:
    ev.preventDefault();
    navigator.clipboard.writeText(L.email).then(() => {
      badge.textContent = "copied";
      setTimeout(() => { badge.textContent = "copy"; }, 1600);
    }).catch(() => { location.href = m.href; });
  });
} else $("fmail").remove();

links.filter(x => x.k !== "cv").forEach(x => {
  const a = el("a", "", x.t);
  if (x.u.startsWith("mailto")) a.href = x.u; else ext(a, x.u);
  $("flinks").append(a);
});
$("fnote").textContent = "© " + new Date().getFullYear() + " " + DATA.name +
  (DATA.location ? " · " + DATA.location : "");

/* ============================================================== behaviour */
const root = document.documentElement;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* drawer */
const drawer = $("drawer"), burger = $("burger");
const setDrawer = o => {
  drawer.classList.toggle("open", o);
  drawer.setAttribute("aria-hidden", String(!o));
  burger.setAttribute("aria-expanded", String(o));
  document.body.style.overflow = o ? "hidden" : "";
};
burger.onclick = () => setDrawer(true);
$("dclose").onclick = () => setDrawer(false);
drawer.addEventListener("click", e => { if (e.target.closest("a")) setDrawer(false); });
addEventListener("keydown", e => { if (e.key === "Escape") setDrawer(false); });
links.forEach(x => $("dfoot").append(mkBtn(x)));

/* sticky nav + back-to-top */
const navEl = $("nav"), totop = $("totop");
let q = false;
const onScroll = () => {
  const y = scrollY;
  navEl.classList.toggle("stuck", y > 8);
  totop.classList.toggle("show", y > innerHeight * .9);
  q = false;
};
addEventListener("scroll", () => { if (!q) { q = true; requestAnimationFrame(onScroll); } },
  { passive: true });
onScroll();
totop.onclick = () => scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });

/* reveal */
document.querySelectorAll(".rv").forEach(x => {
  const i = [...x.parentElement.children].indexOf(x);
  x.style.transitionDelay = Math.min(i * 45, 180) + "ms";
});
const targets = [...document.querySelectorAll(".rv")];
const showAll = () => {
  root.classList.remove("reveal-on");
  targets.forEach(x => x.classList.add("in"));
  // bars key off .in, so anything not inside a .rv needs nudging directly
  document.querySelectorAll(".bar").forEach(b => b.classList.add("on"));
};

if (!("IntersectionObserver" in window) || reduce) {
  showAll();
} else {
  root.classList.add("reveal-on");
  let seen = 0;
  const rio = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    seen++; e.target.classList.add("in"); rio.unobserve(e.target);
  }), { rootMargin: "0px 0px -8% 0px", threshold: .04 });
  targets.forEach(x => rio.observe(x));

  // Failsafe: nothing reported shortly after load means the observer is broken.
  // Show the page rather than leave it blank.
  setTimeout(() => { if (seen === 0) showAll(); }, 2500);
}

/* active nav link */
const all = [...document.querySelectorAll(".nav-links a, .drawer li a")];
const nio = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  all.forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id));
}), { rootMargin: "-45% 0px -50% 0px" });
document.querySelectorAll("main section").forEach(s => nio.observe(s));

/* The entrance runs now, with the content in place. Starting it earlier would
   animate an empty skeleton and be over before data.js had rendered a word. */
document.documentElement.classList.add("boot");
initMotion();
}
</script>
<script>
/* ==========================================================================
   MOTION

   Four pieces, each tied to something real on the page rather than added for
   its own sake: an ambient field behind the hero, the hero readings counting
   up to their actual values, cards that answer the pointer, and one rule in
   the nav that slides to the section you are in.

   Everything here is skipped outright when the reader asks for reduced
   motion — the page is fully usable with none of it.
   ========================================================================== */
function initMotion() {
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------------------------------------------------------- the field */
  /* A slow lattice drifting behind the hero, drawn rather than hand-authored
     as SVG path data. Nodes brighten as they pass the scan line, which is the
     only thing moving, so the whole thing costs one pass over ~120 points. */
  const canvas = document.querySelector(".field");
  if (canvas && !still) {
    const ctx = canvas.getContext("2d", { alpha: true });
    let w = 0, h = 0, pts = [], raf = 0, t = 0;

    const build = () => {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      const r = canvas.getBoundingClientRect();
      w = r.width; h = r.height;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      // a loose grid, jittered off the lattice so it does not read as a table
      const step = w < 600 ? 62 : 78;
      pts = [];
      for (let x = step * .5; x < w + step; x += step)
        for (let y = step * .5; y < h + step; y += step)
          pts.push({
            x: x + (((x * 7 + y * 13) % 11) - 5) * 2.2,
            y: y + (((x * 3 + y * 17) % 9) - 4) * 2.2,
          });
    };

    const frame = () => {
      t += 0.0042;
      ctx.clearRect(0, 0, w, h);

      // the scan: a soft band sweeping down, wrapping round
      const scan = ((t % 1) * (h + 260)) - 130;

      for (const p of pts) {
        const d = Math.abs(p.y - scan);
        const lit = Math.max(0, 1 - d / 150);          // 0 far from the scan, 1 on it
        const a = 0.05 + lit * 0.5;

        ctx.beginPath();
        ctx.arc(p.x, p.y, lit > .35 ? 1.5 : 1, 0, 6.2832);
        ctx.fillStyle = "rgba(143,166,191," + a.toFixed(3) + ")";
        ctx.fill();

        // a short tick on the brightest nodes, echoing the gauges
        if (lit > .78) {
          ctx.beginPath();
          ctx.moveTo(p.x + 4, p.y);
          ctx.lineTo(p.x + 11, p.y);
          ctx.strokeStyle = "rgba(196,212,228," + (lit * .32).toFixed(3) + ")";
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }
      raf = requestAnimationFrame(frame);
    };

    build();
    // Pause when the hero is off screen; an animation nobody can see is waste.
    const vis = new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting && !raf) raf = requestAnimationFrame(frame);
      else if (!e.isIntersecting && raf) { cancelAnimationFrame(raf); raf = 0; }
    }), { threshold: 0 });
    vis.observe(canvas);

    let rz;
    addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(build, 180); });
  }

  /* ------------------------------------------------------- the readings */
  /* The three hero numbers count up to the values already in the markup, so
     the text is correct before, during and after — nothing is invented and
     nothing is lost if this never runs. Tabular figures keep the width fixed
     so the layout cannot shift while it counts. */
  const mags = [...document.querySelectorAll(".mag b")];
  if (mags.length && !still) {
    const run = el => {
      const target = parseInt(el.textContent, 10);
      if (!Number.isFinite(target)) return;
      const dur = 900, t0 = performance.now();
      el.textContent = "0";
      const step = now => {
        const k = Math.min((now - t0) / dur, 1);
        const eased = 1 - Math.pow(1 - k, 3);
        el.textContent = String(Math.round(target * eased));
        if (k < 1) requestAnimationFrame(step);
        else el.textContent = String(target);      // always land exactly
      };
      requestAnimationFrame(step);
    };
    const io = new IntersectionObserver(es => es.forEach(e => {
      if (!e.isIntersecting) return;
      run(e.target);
      io.unobserve(e.target);
    }), { threshold: .6 });
    mags.forEach(m => io.observe(m));
  }

  /* ------------------------------------------------------------- cards */
  /* Pointer position drives both the sheen and a two-degree tilt. Written to
     custom properties so the CSS owns the look and this only reports where
     the cursor is. */
  if (!still && matchMedia("(hover:hover)").matches) {
    const TILT = 2;
    document.addEventListener("pointermove", e => {
      const c = e.target.closest(".card");
      if (!c) return;
      const r = c.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width;
      const py = (e.clientY - r.top) / r.height;
      c.style.setProperty("--mx", (px * 100).toFixed(1) + "%");
      c.style.setProperty("--my", (py * 100).toFixed(1) + "%");
      c.style.transform =
        "perspective(900px) rotateY(" + ((px - .5) * TILT * 2).toFixed(2) + "deg)" +
        " rotateX(" + ((.5 - py) * TILT * 2).toFixed(2) + "deg)";
    }, { passive: true });

    document.addEventListener("pointerout", e => {
      const c = e.target.closest?.(".card");
      if (c && !c.contains(e.relatedTarget)) c.style.transform = "";
    }, { passive: true });
  }

  /* --------------------------------------------------- the nav indicator */
  /* One rule that travels to the active link instead of a colour flicking on
     and off each one. Positioned from the link's own box, so it stays correct
     when the labels or the font change. */
  const links = document.querySelector(".nav-links");
  if (links && links.children.length) {
    const ind = document.createElement("span");
    ind.className = "nav-ind";
    links.append(ind);

    /* Every write here is guarded. classList.add still queues a mutation
       record when the class is already present, so an unguarded version of
       this fed its own observer and starved the microtask queue — the main
       thread wedged and the whole page stopped responding. */
    const move = () => {
      const on = links.querySelector("a.on");
      if (!on) {
        if (ind.classList.contains("on")) ind.classList.remove("on");
        return;
      }
      const l = on.offsetLeft + "px", w = on.offsetWidth + "px";
      if (ind.style.left !== l) ind.style.left = l;
      if (ind.style.width !== w) ind.style.width = w;
      if (!ind.classList.contains("on")) ind.classList.add("on");
    };

    /* The active class is set by the section observer in boot(). Each anchor is
       observed on its own rather than the whole subtree, so the indicator —
       which lives inside .nav-links — can never trigger this. */
    const mo = new MutationObserver(move);
    links.querySelectorAll("a").forEach(a =>
      mo.observe(a, { attributes: true, attributeFilter: ["class"] }));
    addEventListener("resize", move);
    move();
  }
}
</script>

</body>
