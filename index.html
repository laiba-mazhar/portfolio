<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laiba Mazhar</title>
<meta name="description" content="Data Scientist & ML Researcher — trustworthy and diagnosable ML systems.">
<meta name="theme-color" content="#0b0e14">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='14' y='54' width='16' height='32' fill='%23e3a544'/><rect x='42' y='30' width='16' height='56' fill='%23e3a544'/><rect x='70' y='14' width='16' height='72' fill='%235b9dc4'/></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,600;1,400&display=swap">

<style>
/* ==========================================================================
   THE ATTRIBUTION LEDGER

   Her research decomposes an observed change into per-operator contributions.
   The page borrows that grammar: a metadata gutter carrying real magnitudes,
   and proportional bars off a shared baseline as the recurring signature.

   Dark only, deliberately. This site has always been dark, and following the
   OS preference meant a light-mode machine got a white page nobody asked for.
   Every colour below is painted explicitly so the page never borrows a ground.
   ========================================================================== */
:root{
  color-scheme: dark;

  /* blue-black ground; neutrals biased blue because the accent is warm */
  --bg:#0b0e14;
  --surface:#121722;
  --surface-2:#171d29;
  --line:#1f2733;
  --line-2:#2b3543;

  --ink:#eaeef4;
  --ink-2:#97a3b4;
  --ink-3:#5f6b7c;

  --amber:#e3a544;      /* the positive contribution */
  --blue:#5b9dc4;       /* the counterweight */
  --amber-dim:rgba(227,165,68,.14);
  --blue-dim:rgba(91,157,196,.14);

  --maxw:1180px;
  --gut:40px;
  --rail:130px;         /* the ledger's metadata gutter */
  --r:7px;
  --ease:cubic-bezier(.2,.6,.35,1);

  --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:88px;-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);
  font:400 16px/1.62 var(--sans);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
ul{list-style:none}
::selection{background:var(--amber);color:#241a06}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:3px}

.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--gut)}
@media(max-width:860px){ :root{--gut:20px;--rail:0px} }

/* the lab's three voices */
.ser{font-family:var(--serif);font-weight:600;letter-spacing:-.018em}
.mo{
  font-family:var(--mono);font-size:11px;font-weight:400;
  letter-spacing:.11em;text-transform:uppercase;font-variant-numeric:tabular-nums;
}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.skip{position:absolute;left:14px;top:-60px;z-index:200;background:var(--amber);color:#241a06;
  padding:10px 16px;border-radius:var(--r);font-weight:600;font-size:14px;transition:top .2s}
.skip:focus{top:14px}

/* =============================================================== the bar */
/* The page's one repeated idea: a magnitude drawn off a common baseline.
   Every instance is a real proportion of real content, never decoration. */
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;width:100%}
.bar i{display:block;height:100%;width:0;background:var(--amber);border-radius:2px;
  transition:width 1s var(--ease)}
.bar.cool i{background:var(--blue)}
.in .bar i,.bar.on i{width:var(--w,0%)}

/* =================================================================== nav */
nav{position:sticky;top:0;z-index:80;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .3s}
nav.stuck{border-bottom-color:var(--line)}
.nav-in{display:flex;align-items:center;gap:22px;height:72px}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto}
.brand svg{width:17px;height:17px;flex:none}
.brand b{font-family:var(--serif);font-weight:600;font-size:18px;letter-spacing:-.02em}
.nav-links{display:flex;gap:22px}
.nav-links a{color:var(--ink-3);font-family:var(--mono);font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;padding:5px 0;border-bottom:1px solid transparent;
  transition:color .2s,border-color .2s;white-space:nowrap}
.nav-links a:hover{color:var(--ink-2)}
.nav-links a.on{color:var(--amber);border-bottom-color:var(--amber)}
@media(max-width:1080px){ .nav-links{display:none} }
.ib{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--line);
  border-radius:var(--r);color:var(--ink-2);flex:none;transition:border-color .2s,color .2s}
.ib:hover{border-color:var(--line-2);color:var(--ink)}
.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
#burger{display:none}
@media(max-width:1080px){ #burger{display:grid} }
.nav-r{display:flex;align-items:center;gap:10px;flex:none}
@media(max-width:640px){ .nav-r .btn{display:none} }

/* ------------------------------------------------------------------ button */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 17px;border-radius:var(--r);
  font-size:14px;font-weight:500;border:1px solid var(--line-2);color:var(--ink-2);
  transition:border-color .2s,color .2s,background .2s}
.btn:hover{border-color:var(--amber);color:var(--amber);background:var(--amber-dim)}
.btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn.pri{background:var(--amber);border-color:var(--amber);color:#241a06;font-weight:600}
.btn.pri:hover{background:#eeb457;border-color:#eeb457;color:#241a06}

/* -------------------------------------------------------------- mobile nav */
.drawer{position:fixed;inset:0;z-index:95;background:var(--bg);display:flex;flex-direction:column;
  padding:16px var(--gut) 30px;opacity:0;pointer-events:none;transition:opacity .25s var(--ease)}
.drawer.open{opacity:1;pointer-events:auto}
.dtop{display:flex;align-items:center;justify-content:space-between;height:56px}
.drawer ul{margin-top:16px;flex:1;overflow-y:auto}
.drawer li{border-bottom:1px solid var(--line)}
.drawer li a{display:flex;align-items:baseline;gap:14px;padding:15px 2px;
  font-family:var(--serif);font-weight:600;font-size:25px;letter-spacing:-.02em}
.drawer li a span{font-family:var(--mono);font-size:10.5px;color:var(--amber);flex:none}
.dfoot{display:flex;flex-wrap:wrap;gap:8px;padding-top:18px}

/* ================================================================== hero */
header{padding:78px 0 88px;border-bottom:1px solid var(--line)}
@media(max-width:860px){ header{padding:40px 0 52px} }
.hero{display:grid;grid-template-columns:1fr 260px;gap:56px;align-items:end}
@media(max-width:860px){ .hero{grid-template-columns:1fr;gap:34px} }

.eyebrow{display:flex;align-items:center;gap:12px;color:var(--amber);margin-bottom:30px}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line);max-width:180px}
h1{font-family:var(--serif);font-weight:600;letter-spacing:-.032em;line-height:.96;
  font-size:clamp(48px,7vw,88px)}
h1 em{font-style:italic;font-weight:400;color:var(--ink-2)}
.tagline{font-size:clamp(17px,1.7vw,21px);line-height:1.45;margin-top:24px;max-width:30ch;
  color:var(--ink)}
.intro{color:var(--ink-2);margin-top:20px;max-width:64ch;font-size:15.5px}
.cta{display:flex;flex-wrap:wrap;gap:9px;margin-top:30px}

.portrait{position:relative}
.portrait img{width:100%;aspect-ratio:1/1;object-fit:cover;border:1px solid var(--line);
  border-radius:var(--r);filter:saturate(.92)}
.portrait .cap{display:flex;align-items:center;gap:8px;margin-top:11px;color:var(--ink-3)}
.portrait .cap b{width:5px;height:5px;border-radius:50%;background:var(--amber);flex:none}
@media(max-width:860px){ .portrait{max-width:168px} }

/* --- the ledger strip: three magnitudes, drawn as bars off one baseline --- */
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:34px;margin-top:56px;
  padding-top:28px;border-top:1px solid var(--line)}
@media(max-width:640px){ .strip{grid-template-columns:1fr;gap:22px} }
.mag b{font-family:var(--serif);font-weight:600;font-size:40px;line-height:1;
  letter-spacing:-.028em;font-variant-numeric:tabular-nums;display:block}
.mag .lb{color:var(--ink-3);margin:9px 0 12px;display:block}

/* ============================================================== sections */
main section{padding:88px 0;border-bottom:1px solid var(--line)}
@media(max-width:860px){ main section{padding:56px 0} }
.s-head{display:grid;grid-template-columns:var(--rail) 1fr;gap:0;margin-bottom:46px;
  align-items:baseline}
.s-head .ix{color:var(--amber)}
h2{font-family:var(--serif);font-weight:600;letter-spacing:-.026em;line-height:1;
  font-size:clamp(27px,3.4vw,40px)}
.s-head .rt{margin-left:auto;color:var(--ink-3);text-align:right}
.s-head .hb{display:flex;align-items:baseline;gap:16px}
@media(max-width:860px){
  .s-head{grid-template-columns:1fr;gap:12px}
  .s-head .ix{display:block}
}

/* --- the ledger row: metadata in the gutter, content in the body --- */
.led{display:grid;grid-template-columns:var(--rail) 1fr;gap:0;
  padding:30px 0;border-top:1px solid var(--line)}
.led:first-child{border-top:0;padding-top:0}
.led:last-child{padding-bottom:0}
.led-g{color:var(--ink-3);padding-right:22px}
.led-g .k{display:block}
.led-g .bar{margin-top:12px;max-width:64px}
@media(max-width:860px){
  .led{grid-template-columns:1fr;gap:12px;padding:24px 0}
  .led-g{padding-right:0;display:flex;align-items:center;gap:14px}
  .led-g .bar{margin-top:0;flex:1;max-width:90px}
}

/* =============================================================== research */
.led h3{font-family:var(--serif);font-weight:600;font-size:clamp(19px,2.1vw,25px);
  line-height:1.24;letter-spacing:-.022em;max-width:40ch}
.who{color:var(--ink-2);font-size:14px;margin-top:11px}
.st{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--blue);border:1px solid var(--blue-dim);background:var(--blue-dim);
  padding:3px 8px;border-radius:4px;margin-left:9px;white-space:nowrap}
.abs{color:var(--ink-2);font-size:15px;margin-top:14px;max-width:76ch}
.row{display:flex;gap:18px;margin-top:16px;flex-wrap:wrap}
.lnk{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;
  color:var(--amber)}
.lnk::after{content:"→";transition:transform .25s var(--ease)}
.lnk:hover::after{transform:translateX(4px)}

/* ================================================================== tags */
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;color:var(--ink-3);
  border:1px solid var(--line);padding:4px 9px;border-radius:4px;white-space:nowrap;
  transition:color .2s,border-color .2s}
.tag:hover{color:var(--ink-2);border-color:var(--line-2)}

/* ============================================================ org marks */
.org-line{display:flex;align-items:center;gap:13px}
.mark{width:40px;height:40px;flex:none;display:grid;place-items:center;padding:6px;
  background:#fff;border-radius:5px}
.mark img{max-width:100%;max-height:100%;object-fit:contain}
.mark .mg{font-family:var(--mono);font-size:13px;font-weight:500;color:#0b0e14}
.orgn{color:var(--blue);font-size:15px}
.where{color:var(--ink-3);font-size:13px;margin-top:2px}
.det{color:var(--ink-2);font-size:14.5px;margin-top:12px}
.led ul{margin-top:14px}
.led li{color:var(--ink-2);font-size:15px;padding-left:17px;position:relative;
  margin-bottom:6px;max-width:74ch}
.led li::before{content:"";position:absolute;left:0;top:10px;width:7px;height:1px;
  background:var(--amber)}

/* =============================================================== projects */
.filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:24px}
.chip{border:1px solid var(--line);color:var(--ink-2);padding:7px 14px;border-radius:var(--r);
  font-size:13.5px;transition:border-color .2s,color .2s,background .2s}
.chip .n{font-family:var(--mono);font-size:10px;opacity:.55;margin-left:7px}
.chip:hover{border-color:var(--line-2);color:var(--ink)}
.chip.on{background:var(--amber);border-color:var(--amber);color:#241a06;font-weight:600}
.chip.on .n{opacity:.7}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(292px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card{background:var(--bg);padding:26px;display:flex;flex-direction:column;
  transition:background .25s}
.card:hover{background:var(--surface)}
.card .pk{color:var(--amber);margin-bottom:12px;display:flex;align-items:center;gap:7px}
.card .pk::before{content:"";width:4px;height:4px;border-radius:50%;background:var(--amber)}
.card h3{font-family:var(--serif);font-weight:600;font-size:17.5px;letter-spacing:-.02em;
  line-height:1.3;display:flex;align-items:flex-start;gap:9px}
.card:hover h3{color:var(--amber)}
.card h3{transition:color .25s}
.card .aw{margin-left:auto;flex:none;color:var(--ink-3);font-size:13px;
  transition:transform .25s var(--ease),color .25s}
.card:hover .aw{transform:translate(3px,-3px);color:var(--amber)}
.card p{color:var(--ink-2);font-size:14.5px;margin-top:10px;flex:1}
.card.gone{display:none}
.none{color:var(--ink-3);padding:24px 0}

/* ================================================================= skills */
/* Each group's bar is its share of the 93 listed skills — the count is real
   information, so it gets drawn rather than just printed. */
.sk{padding:22px 0;border-top:1px solid var(--line)}
.sk:first-child{border-top:0;padding-top:0}
.sk-h{display:grid;grid-template-columns:var(--rail) 1fr auto;gap:0;align-items:center;
  margin-bottom:14px}
.sk-h .g{color:var(--ink)}
.sk-h .bw{max-width:210px;margin:0 18px}
.sk-h .ct{color:var(--ink-3);font-family:var(--mono);font-size:11px}
@media(max-width:860px){
  .sk-h{grid-template-columns:1fr auto;gap:10px}
  .sk-h .bw{grid-column:1/-1;max-width:none;margin:6px 0 0;order:3}
}
.sk-i{display:flex;flex-wrap:wrap;gap:6px;padding-left:var(--rail)}
@media(max-width:860px){ .sk-i{padding-left:0} }
.sk-i span{font-size:13px;color:var(--ink-2);background:var(--surface);
  border:1px solid var(--line);padding:4px 10px;border-radius:4px;
  transition:color .2s,border-color .2s}
.sk-i span:hover{color:var(--ink);border-color:var(--line-2)}

/* ================================================================= awards */
.awd{display:grid;grid-template-columns:var(--rail) 1fr;padding:14px 0;
  border-top:1px solid var(--line);font-size:15px;align-items:baseline}
.awd:first-child{border-top:0}
.awd .y{color:var(--ink-3);font-family:var(--mono);font-size:11.5px}
@media(max-width:860px){ .awd{grid-template-columns:1fr;gap:4px} .awd .y{order:-1} }

/* ============================================================= activities */
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.act{background:var(--bg);padding:22px;transition:background .25s}
.act:hover{background:var(--surface)}
.act h3{font-family:var(--serif);font-weight:600;font-size:16px;letter-spacing:-.016em;
  line-height:1.34}
.act:hover h3{color:var(--amber)}
.act h3{transition:color .25s}
.act p{color:var(--ink-2);font-size:14px;margin-top:7px}
.g-label{display:flex;align-items:center;gap:14px;color:var(--ink-3);margin:38px 0 16px}
.g-label::after{content:"";flex:1;height:1px;background:var(--line)}
.g-label:first-child{margin-top:0}

/* ==================================================== interests & langs */
.two{display:grid;grid-template-columns:1fr 1fr;gap:52px}
@media(max-width:780px){ .two{grid-template-columns:1fr;gap:34px} }
.ch{color:var(--ink-3);margin-bottom:18px}
.lg{padding:13px 0;border-top:1px solid var(--line)}
.lg:first-of-type{border-top:0}
.lg-t{display:flex;align-items:baseline;gap:14px}
.lg-t b{font-family:var(--serif);font-weight:600;font-size:16px;letter-spacing:-.016em}
.lg-t span{color:var(--ink-3);font-size:13px;margin-left:auto;text-align:right}
.lg .bar{margin-top:9px;max-width:190px}

/* ================================================================= footer */
footer{padding:88px 0 56px}
.fcta{font-family:var(--serif);font-weight:600;letter-spacing:-.03em;line-height:1.04;
  font-size:clamp(32px,5.4vw,60px);max-width:22ch}
.fcta em{font-style:italic;font-weight:400;color:var(--amber)}
.mail{display:inline-flex;align-items:center;gap:12px;margin-top:30px;font-size:clamp(17px,2.2vw,24px);
  font-family:var(--mono);letter-spacing:-.01em;border-bottom:1px solid var(--line-2);
  padding-bottom:6px;transition:color .25s,border-color .25s}
.mail:hover{color:var(--amber);border-bottom-color:var(--amber)}
.mail small{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);border:1px solid var(--line);border-radius:4px;padding:3px 7px}
.fbar{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-top:56px;padding-top:22px;
  border-top:1px solid var(--line);color:var(--ink-3);font-size:13px}
.flinks{display:flex;gap:18px;flex-wrap:wrap;margin-left:auto}
.flinks a{color:var(--ink-2);font-size:14px;transition:color .2s}
.flinks a:hover{color:var(--amber)}

/* ================================================================= to top */
.top{position:fixed;right:18px;bottom:18px;z-index:70;width:40px;height:40px;
  border-radius:var(--r);border:1px solid var(--line);background:var(--surface);
  color:var(--ink-2);display:grid;place-items:center;opacity:0;pointer-events:none;
  transform:translateY(8px);transition:opacity .3s,transform .3s,border-color .2s,color .2s}
.top.show{opacity:1;pointer-events:auto;transform:none}
.top:hover{border-color:var(--amber);color:var(--amber)}
.top svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}

/* ================================================================= reveal */
/* Visible by default. Only hidden while `reveal-on` sits on <html>, which JS
   adds after confirming IntersectionObserver works and removes if it never
   fires. A scroll animation must degrade to "shown", never to a blank page. */
.rv{transition:opacity .6s var(--ease),transform .6s var(--ease)}
html.reveal-on .rv:not(.in){opacity:0;transform:translateY(14px)}

@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important}
  html.reveal-on .rv{opacity:1!important;transform:none!important;transition:none!important}
  .bar i{transition:none}
  .lnk:hover::after,.card:hover .aw{transform:none}
}
</style>
</head>
<body>

<a class="skip" href="#main">Skip to content</a>

<nav id="nav">
  <div class="wrap nav-in">
    <a href="#top" class="brand" aria-label="Back to top">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <rect x="8"  y="54" width="18" height="32" fill="#e3a544"/>
        <rect x="41" y="30" width="18" height="56" fill="#e3a544"/>
        <rect x="74" y="14" width="18" height="72" fill="#5b9dc4"/>
      </svg>
      <b id="nav-name"></b>
    </a>
    <div class="nav-links" id="navlinks"></div>
    <div class="nav-r">
      <a class="btn pri" id="nav-cv" href="#" hidden>Curriculum Vitae</a>
      <button class="ib" id="burger" aria-label="Open menu" aria-expanded="false" aria-controls="drawer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
</nav>

<div class="drawer" id="drawer" aria-hidden="true">
  <div class="dtop">
    <b class="ser" id="drawer-name" style="font-size:18px"></b>
    <button class="ib" id="dclose" aria-label="Close menu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <ul id="dlinks"></ul>
  <div class="dfoot" id="dfoot"></div>
</div>

<span id="top"></span>

<header class="wrap">
  <div class="hero">
    <div>
      <div class="eyebrow mo" id="h-eyebrow"></div>
      <h1 id="h-name"></h1>
      <p class="tagline" id="h-tag"></p>
      <p class="intro" id="h-intro"></p>
      <div class="cta" id="h-cta"></div>
    </div>
    <div class="portrait" id="h-portrait"></div>
  </div>
  <div class="strip" id="h-strip"></div>
</header>

<main id="main"></main>

<footer>
  <div class="wrap">
    <h2 class="fcta">Looking for someone who can tell you <em>which part broke.</em></h2>
    <a class="mail" id="fmail" href="#"></a>
    <div class="fbar">
      <span id="fnote"></span>
      <div class="flinks" id="flinks"></div>
    </div>
  </div>
</footer>

<button class="top" id="totop" aria-label="Back to top">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg>
</button>

<script>
/* The local preview server sends no Cache-Control, so browsers keep serving a
   stale data.js after every edit. On localhost we add a timestamp; in
   production the URL stays clean. */
(() => {
  const dev = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
  const tag = document.createElement("script");
  tag.src = "data.js" + (dev ? "?t=" + Date.now() : "");
  tag.onload = () => boot();
  tag.onerror = () => document.body.innerHTML =
    '<p style="padding:40px;font:16px sans-serif">Could not load data.js</p>';
  document.head.append(tag);
})();
</script>

<script>
function boot(){
const $ = id => document.getElementById(id);
const el = (t, c, txt) => { const n = document.createElement(t); if (c) n.className = c;
  if (txt !== undefined) n.textContent = txt; return n; };
const tidy = s => String(s ?? "").replace(/\s+/g, " ").trim();
const ext = (a, u) => { a.href = u; a.target = "_blank"; a.rel = "noopener noreferrer"; return a; };

const SVGNS = "http://www.w3.org/2000/svg";
const icon = d => {
  const s = document.createElementNS(SVGNS, "svg");
  s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("aria-hidden", "true");
  const p = document.createElementNS(SVGNS, "path"); p.setAttribute("d", d);
  s.append(p); return s;
};
const ICON = {
  cv:'M14 3v5h5M13.5 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8.5Z',
  email:'M3 7.5A1.5 1.5 0 0 1 4.5 6h15A1.5 1.5 0 0 1 21 7.5v9A1.5 1.5 0 0 1 19.5 18h-15A1.5 1.5 0 0 1 3 16.5ZM3.6 7l8.4 6 8.4-6',
  github:'M9 19c-4 1.4-4-2.1-5.5-2.6m11.5 5v-3.6a3 3 0 0 0-.9-2.4c2.9-.3 4.9-1.5 4.9-5.2a4 4 0 0 0-1.1-2.8 3.7 3.7 0 0 0-.1-2.8s-1.2-.4-3.8 1.4a9.3 9.3 0 0 0-5 0C6.4 3.4 5.2 3.8 5.2 3.8a3.7 3.7 0 0 0-.1 2.8A4 4 0 0 0 4 9.4c0 3.7 2 4.9 4.9 5.2a3 3 0 0 0-.9 2.3V21',
  linkedin:'M6.5 9.5V18M6.5 6.2v.1M11 18v-4.8a2.7 2.7 0 0 1 5.4 0V18M3 4.5h18v15H3Z',
  scholar:'M12 3 2 8.5 12 14l10-5.5ZM6 11v5.5c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5V11',
};

/* a magnitude bar: width is a real proportion, animated in on reveal */
const mkBar = (pct, cool) => {
  const b = el("div", "bar" + (cool ? " cool" : ""));
  b.style.setProperty("--w", Math.max(3, Math.min(100, pct)) + "%");
  b.append(el("i"));
  return b;
};

document.title = DATA.name;
$("nav-name").textContent = DATA.name;
$("drawer-name").textContent = DATA.name;
if (DATA.title) $("h-eyebrow").textContent = DATA.title;

/* first name upright, surname in the serif italic */
const parts = String(DATA.name).split(/\s+/);
$("h-name").append(document.createTextNode(parts[0]));
if (parts.length > 1) {
  $("h-name").append(document.createTextNode(" "),
    el("em", "", parts.slice(1).join(" ")));
}
$("h-tag").textContent = DATA.tagline;
$("h-intro").textContent = tidy(DATA.intro);

/* ---------------------------------------------------------------- portrait */
if (DATA.photo?.src) {
  const img = new Image();
  img.src = DATA.photo.src; img.alt = DATA.photo.alt || DATA.name;
  img.onerror = () => $("h-portrait").remove();     // never leave a broken image
  $("h-portrait").append(img);
  if (DATA.location) {
    const cap = el("div", "cap mo");
    cap.append(el("b"), document.createTextNode(DATA.location));
    $("h-portrait").append(cap);
  }
} else $("h-portrait").remove();

/* ------------------------------------------------------------------- links */
const L = DATA.links || {};
const links = [
  L.cv       && { t:"Curriculum Vitae", u:L.cv, k:"cv", pri:true },
  L.email    && { t:"Email",    u:"mailto:" + L.email, k:"email" },
  L.github   && { t:"GitHub",   u:L.github,   k:"github" },
  L.linkedin && { t:"LinkedIn", u:L.linkedin, k:"linkedin" },
  L.scholar  && { t:"Scholar",  u:L.scholar,  k:"scholar" },
].filter(Boolean);

const mkBtn = x => {
  const a = el("a", "btn" + (x.pri ? " pri" : ""));
  a.append(icon(ICON[x.k]), document.createTextNode(x.t));
  if (x.u.startsWith("mailto")) a.href = x.u; else ext(a, x.u);
  return a;
};
links.forEach(x => $("h-cta").append(mkBtn(x)));
if (L.cv) { const b = $("nav-cv"); ext(b, L.cv); b.hidden = false; } else $("nav-cv").remove();

/* --------------------------------------------------------- ledger strip */
/* Three counts, each drawn against the largest of them so the bars compare. */
const mags = [
  [DATA.research?.length, "research manuscripts"],
  [DATA.projects?.length, "projects built"],
  [DATA.awards?.length,   "awards & honours"],
].filter(([n]) => n);
const peak = Math.max(...mags.map(([n]) => n), 1);
mags.forEach(([n, label], i) => {
  const d = el("div", "mag rv");
  d.append(el("b", "", String(n)), el("span", "lb mo", label), mkBar(n / peak * 100, i === 2));
  $("h-strip").append(d);
});

/* ====================================================== section machinery */
const main = $("main"), navl = $("navlinks"), dl = $("dlinks");
let n = 0;

function section(id, title, node, opts = {}) {
  if (!node) return;
  n++;
  const num = String(n).padStart(2, "0");
  const s = el("section"); s.id = id;
  const w = el("div", "wrap");

  const head = el("div", "s-head rv");
  head.append(el("span", "ix mo", num));
  const hb = el("div", "hb");
  hb.append(el("h2", "", title));
  if (opts.count) hb.append(el("span", "rt mo", opts.count));
  head.append(hb);
  w.append(head, node); s.append(w); main.append(s);

  const label = opts.nav || title;
  const a = el("a", "", label); a.href = "#" + id; navl.append(a);
  const li = el("li"), a2 = el("a");
  a2.href = "#" + id;
  a2.append(el("span", "", num), document.createTextNode(label));
  li.append(a2); dl.append(li);
}

const monogram = name => String(name).replace(/^TODO.*/i, "?")
  .split(/\s+/).filter(w => w.length > 2 && !/^(of|and|the|for)$/i.test(w))
  .slice(0, 2).map(w => w[0].toUpperCase()).join("");

function orgMark(logo, org) {
  const m = el("div", "mark");
  if (logo) {
    const img = new Image();
    img.src = logo; img.alt = org + " logo"; img.decoding = "async";
    // A monogram stands in if the file 404s, so nothing renders as broken.
    img.onerror = () => { m.textContent = ""; m.append(el("span", "mg", monogram(org))); };
    m.append(img);
  } else m.append(el("span", "mg", monogram(org)));
  return m;
}
const tagRow = list => { const t = el("div", "tags");
  list.forEach(x => t.append(el("span", "tag", x))); return t; };

/* a ledger row: gutter keys on the left, content on the right */
const ledger = (keys, body) => {
  const d = el("div", "led rv");
  const g = el("div", "led-g mo");
  keys.filter(Boolean).forEach(k => g.append(typeof k === "string" ? el("span", "k", k) : k));
  d.append(g, body);
  return d;
};

/* =============================================================== research */
if (DATA.research?.length) {
  const box = el("div");
  DATA.research.forEach((p, i) => {
    const b = el("div");
    b.append(el("h3", "", p.title));
    const who = el("p", "who", `${p.authors} · ${p.year}`);
    if (p.status) who.append(el("span", "st", p.status));
    b.append(who);
    if (p.abstract) b.append(el("p", "abs", tidy(p.abstract)));
    if (p.tags?.length) b.append(tagRow(p.tags));
    if (p.links?.length) {
      const r = el("div", "row");
      p.links.forEach(x => r.append(ext(el("a", "lnk", x.label), x.url)));
      b.append(r);
    }
    box.append(ledger([String(i + 1).padStart(2, "0"), p.year], b));
  });
  section("research", "Research", box, { count: DATA.research.length + " manuscripts" });
}

/* ============================================================== education */
if (DATA.education?.length) {
  const box = el("div");
  DATA.education.forEach(e => {
    const b = el("div");
    const line = el("div", "org-line");
    line.append(orgMark(e.logo, e.org));
    const t = el("div");
    t.append(el("h3", "", e.degree), el("div", "orgn", e.org));
    if (e.place) t.append(el("div", "where", e.place));
    line.append(t); b.append(line);
    if (e.detail) b.append(el("div", "det", e.detail));
    if (e.courses?.length) b.append(tagRow(e.courses));
    box.append(ledger([e.period], b));
  });
  section("education", "Education", box);
}

/* ============================================================= experience */
if (DATA.experience?.length) {
  const box = el("div");
  DATA.experience.forEach(j => {
    const b = el("div");
    const line = el("div", "org-line");
    line.append(orgMark(j.logo, j.org));
    const t = el("div");
    t.append(el("h3", "", j.role), el("div", "orgn", j.org));
    if (j.place) t.append(el("div", "where", j.place));
    line.append(t); b.append(line);
    if (j.points?.length) {
      const ul = el("ul");
      j.points.forEach(p => ul.append(el("li", "", tidy(p))));
      b.append(ul);
    }
    if (j.stack?.length) b.append(tagRow(j.stack));
    box.append(ledger([j.period], b));
  });
  section("experience", "Experience", box, { count: DATA.experience.length + " roles" });
}

/* =============================================================== projects */
/* All nineteen render. The previous build hid thirteen behind a "show all"
   button, so most of the work was invisible unless you happened to click. */
if (DATA.projects?.length) {
  const box = el("div");
  const cats = [...new Set(DATA.projects.map(p => p.category || "Other"))];
  const nFeat = DATA.projects.filter(p => p.featured).length;

  const card = p => {
    const c = el(p.url ? "a" : "div", "card rv");
    c.dataset.cat = p.category || "Other";
    c.dataset.pick = p.featured ? "1" : "";
    if (p.url) ext(c, p.url);
    if (p.featured) c.append(el("div", "pk mo", "Selected"));
    const h = el("h3", "", p.name);
    if (p.url) h.append(el("span", "aw", "↗"));
    c.append(h, el("p", "", tidy(p.blurb)));
    if (p.stack?.length) c.append(tagRow(p.stack));
    return c;
  };

  const filters = el("div", "filters rv");
  const grid = el("div", "pgrid");
  const none = el("p", "none", "Nothing here yet.");
  none.style.display = "none";

  [...DATA.projects].sort((a, b) => (b.featured ? 1 : 0) - (a.featured ? 1 : 0))
    .forEach(p => grid.append(card(p)));

  const defs = [
    { k:"*", label:"All", n:DATA.projects.length },
    nFeat && { k:"@", label:"Selected", n:nFeat },
    ...cats.map(c => ({ k:c, label:c,
      n:DATA.projects.filter(p => (p.category || "Other") === c).length })),
  ].filter(Boolean);

  const apply = k => {
    let shown = 0;
    grid.querySelectorAll(".card").forEach(c => {
      const ok = k === "*" ? true : k === "@" ? c.dataset.pick === "1" : c.dataset.cat === k;
      c.classList.toggle("gone", !ok);
      if (ok) shown++;
    });
    none.style.display = shown ? "none" : "block";
  };

  defs.forEach((d, i) => {
    const b = el("button", "chip" + (i === 0 ? " on" : ""));
    b.append(document.createTextNode(d.label), el("span", "n", String(d.n)));
    b.onclick = () => {
      filters.querySelectorAll(".chip").forEach(x => x.classList.remove("on"));
      b.classList.add("on"); apply(d.k);
    };
    filters.append(b);
  });

  box.append(filters, grid, none);
  section("projects", "Projects", box, { count: DATA.projects.length + " total" });
}

/* ================================================================= skills */
if (DATA.skills?.length) {
  const box = el("div");
  const top = Math.max(...DATA.skills.map(s => s.items.length), 1);
  DATA.skills.forEach(s => {
    const d = el("div", "sk rv");
    const h = el("div", "sk-h");
    const bw = el("div", "bw");
    bw.append(mkBar(s.items.length / top * 100));
    h.append(el("div", "g mo", s.group), bw,
      el("div", "ct", s.items.length + " / " + top));
    const i = el("div", "sk-i");
    s.items.forEach(x => i.append(el("span", "", x)));
    d.append(h, i); box.append(d);
  });
  const total = DATA.skills.reduce((a, s) => a + s.items.length, 0);
  section("skills", "Skills", box, { count: total + " across " + DATA.skills.length + " areas" });
}

/* ================================================================= awards */
if (DATA.awards?.length) {
  const box = el("div");
  DATA.awards.forEach(a => {
    const d = el("div", "awd rv");
    d.append(el("div", "y", a.year), el("div", "", a.text));
    box.append(d);
  });
  section("awards", "Awards", box, { count: DATA.awards.length + " entries" });
}

/* ============================================================= activities */
if (DATA.activities?.length) {
  const box = el("div");
  const groups = new Map();
  DATA.activities.forEach(a => {
    const k = a.group || "Other";
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(a);
  });
  groups.forEach((items, label) => {
    if (groups.size > 1) box.append(el("h3", "g-label mo rv", label));
    const g = el("div", "acts");
    items.forEach(a => {
      const d = el("div", "act rv");
      const h = el("h3");
      if (a.url) { const k = ext(el("a", "", a.title), a.url); k.append(el("span", "", " ↗")); h.append(k); }
      else h.textContent = a.title;
      d.append(h, el("p", "", tidy(a.text)));
      g.append(d);
    });
    box.append(g);
  });
  section("activities", "Community", box, { nav: "Community" });
}

/* ==================================================== interests & langs */
if (DATA.interests?.length || DATA.languages?.length) {
  const box = el("div", "two");
  if (DATA.interests?.length) {
    const c = el("div", "rv");
    c.append(el("div", "ch mo", "Interests"));
    const t = tagRow(DATA.interests); t.style.marginTop = "0";
    c.append(t); box.append(c);
  }
  if (DATA.languages?.length) {
    // The level is read straight off her own wording — nothing inferred beyond it.
    const lvl = s => /native/i.test(s) ? 100 : /basic/i.test(s) ? 40
                   : /fluent|professional/i.test(s) ? 80 : 60;
    const c = el("div", "rv");
    c.append(el("div", "ch mo", "Languages"));
    DATA.languages.forEach(l => {
      const d = el("div", "lg"), t = el("div", "lg-t");
      t.append(el("b", "", l.name), el("span", "", l.level));
      d.append(t, mkBar(lvl(l.level), true));
      c.append(d);
    });
    box.append(c);
  }
  section("interests", "Interests", box, { nav: "Interests" });
}

/* ================================================================= footer */
if (L.email) {
  const m = $("fmail");
  m.href = "mailto:" + L.email;
  m.append(document.createTextNode(L.email), el("small", "", "copy"));
  const badge = m.querySelector("small");
  m.addEventListener("click", ev => {
    if (!navigator.clipboard) return;                  // fall through to mailto:
    ev.preventDefault();
    navigator.clipboard.writeText(L.email).then(() => {
      badge.textContent = "copied";
      setTimeout(() => { badge.textContent = "copy"; }, 1600);
    }).catch(() => { location.href = m.href; });
  });
} else $("fmail").remove();

links.filter(x => x.k !== "cv").forEach(x => {
  const a = el("a", "", x.t);
  if (x.u.startsWith("mailto")) a.href = x.u; else ext(a, x.u);
  $("flinks").append(a);
});
$("fnote").textContent = "© " + new Date().getFullYear() + " " + DATA.name +
  (DATA.location ? " · " + DATA.location : "");

/* ============================================================== behaviour */
const root = document.documentElement;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* drawer */
const drawer = $("drawer"), burger = $("burger");
const setDrawer = o => {
  drawer.classList.toggle("open", o);
  drawer.setAttribute("aria-hidden", String(!o));
  burger.setAttribute("aria-expanded", String(o));
  document.body.style.overflow = o ? "hidden" : "";
};
burger.onclick = () => setDrawer(true);
$("dclose").onclick = () => setDrawer(false);
drawer.addEventListener("click", e => { if (e.target.closest("a")) setDrawer(false); });
addEventListener("keydown", e => { if (e.key === "Escape") setDrawer(false); });
links.forEach(x => $("dfoot").append(mkBtn(x)));

/* sticky nav + back-to-top */
const navEl = $("nav"), totop = $("totop");
let q = false;
const onScroll = () => {
  const y = scrollY;
  navEl.classList.toggle("stuck", y > 8);
  totop.classList.toggle("show", y > innerHeight * .9);
  q = false;
};
addEventListener("scroll", () => { if (!q) { q = true; requestAnimationFrame(onScroll); } },
  { passive: true });
onScroll();
totop.onclick = () => scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });

/* reveal */
document.querySelectorAll(".rv").forEach(x => {
  const i = [...x.parentElement.children].indexOf(x);
  x.style.transitionDelay = Math.min(i * 45, 180) + "ms";
});
const targets = [...document.querySelectorAll(".rv")];
const showAll = () => {
  root.classList.remove("reveal-on");
  targets.forEach(x => x.classList.add("in"));
  // bars key off .in, so anything not inside a .rv needs nudging directly
  document.querySelectorAll(".bar").forEach(b => b.classList.add("on"));
};

if (!("IntersectionObserver" in window) || reduce) {
  showAll();
} else {
  root.classList.add("reveal-on");
  let seen = 0;
  const rio = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    seen++; e.target.classList.add("in"); rio.unobserve(e.target);
  }), { rootMargin: "0px 0px -8% 0px", threshold: .04 });
  targets.forEach(x => rio.observe(x));

  // Failsafe: nothing reported shortly after load means the observer is broken.
  // Show the page rather than leave it blank.
  setTimeout(() => { if (seen === 0) showAll(); }, 2500);
}

/* active nav link */
const all = [...document.querySelectorAll(".nav-links a, .drawer li a")];
const nio = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  all.forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id));
}), { rootMargin: "-45% 0px -50% 0px" });
document.querySelectorAll("main section").forEach(s => nio.observe(s));
}
</script>
</body>
</html>
